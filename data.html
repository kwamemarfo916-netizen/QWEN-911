<!DOCTYPE html>
<html>
<head>
  <title>QWEN-911 Data Bundles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Icons -->
  <link rel="stylesheet"
   href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:linear-gradient(135deg,#001f3f,#3a0ca3);
      color:white;
      padding-bottom:100px;
    }

    .container{
      padding:20px;
    }

    h2{
      text-align:center;
      margin-bottom:15px;
    }

    .wallet-box{
      background:rgba(255,255,255,0.1);
      padding:15px;
      border-radius:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .wallet-box span{
      font-size:18px;
      font-weight:bold;
      color:#00f5ff;
    }

    select, input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:12px;
      margin-bottom:15px;
      font-size:15px;
    }

    .bundle-card{
      background:rgba(255,255,255,0.1);
      padding:15px;
      border-radius:15px;
      margin-bottom:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .buy-btn{
      padding:8px 15px;
      border:none;
      border-radius:20px;
      background:#00f5ff;
      color:black;
      font-weight:bold;
      cursor:pointer;
    }

    /* Receipt Animation */
    .receipt{
      position:fixed;
      top:20px;
      left:50%;
      transform:translateX(-50%) scale(0);
      background:#00c853;
      padding:15px 25px;
      border-radius:25px;
      font-weight:bold;
      transition:0.4s ease;
      z-index:1000;
    }

    .receipt.show{
      transform:translateX(-50%) scale(1);
    }

    /* Floating Menu */
    .menu-bar{
      position:fixed;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      width:90%;
      max-width:420px;
      background:rgba(0,0,0,0.7);
      backdrop-filter:blur(20px);
      border-radius:30px;
      display:flex;
      justify-content:space-around;
      padding:12px 5px;
      box-shadow:0 5px 25px rgba(0,0,0,0.4);
    }

    .menu-bar a{
      text-decoration:none;
      color:#ccc;
      font-size:20px;
      text-align:center;
      flex:1;
      transition:0.3s;
    }

    .menu-bar a.active{
      color:#00f5ff;
      transform:translateY(-5px);
    }

  </style>
</head>
<body>

<div class="receipt" id="receipt">
  ✅ Purchase Successful
</div>

<div class="container">
  <h2>Buy Data Bundles</h2>

  <div class="wallet-box">
    <div>Wallet Balance</div>
    <span id="walletBalance">GH₵ 0.00</span>
  </div>

  <select id="network">
    <option value="">Select Network</option>
    <option value="MTN">MTN</option>
    <option value="Telecel">Telecel</option>
    <option value="AirtelTigo">AirtelTigo</option>
  </select>

  <input type="text" id="phone" placeholder="Enter Phone Number">

  <div id="bundleList"></div>
</div>

<!-- Floating Menu -->
<div class="menu-bar">
  <a href="home.html">
    <i class="fa-solid fa-house"></i>
  </a>
  <a href="stream.html">
    <i class="fa-solid fa-video"></i>
  </a>
  <a href="data.html" class="active">
    <i class="fa-solid fa-sim-card"></i>
  </a>
  <a href="chat.html">
    <i class="fa-solid fa-comments"></i>
  </a>
  <a href="profile.html">
    <i class="fa-solid fa-user"></i>
  </a>
</div>

<script type="module">

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import { getDatabase, ref, get, update } 
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
  authDomain: "qwen-911.firebaseapp.com",
  databaseURL: "https://qwen-911-default-rtdb.firebaseio.com",
  projectId: "qwen-911",
  storageBucket: "qwen-911.firebasestorage.app",
  messagingSenderId: "518019892837",
  appId: "1:518019892837:web:9972dd63d8dca7936ea88c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const bundles = [
  {size:"1GB", price:10},
  {size:"2GB", price:18},
  {size:"5GB", price:40},
  {size:"10GB", price:75}
];

const bundleList = document.getElementById("bundleList");
const walletDisplay = document.getElementById("walletBalance");
const receipt = document.getElementById("receipt");

let currentUser;

onAuthStateChanged(auth, async(user)=>{
  if(!user){
    window.location.href="login.html";
  }else{
    currentUser=user;
    const snapshot = await get(ref(db,"users/"+user.uid+"/wallet"));
    const balance = snapshot.exists() ? snapshot.val() : 0;
    walletDisplay.innerText="GH₵ "+balance.toFixed(2);
  }
});

bundles.forEach(bundle=>{
  const div=document.createElement("div");
  div.className="bundle-card";
  div.innerHTML=`
    <div>
      <strong>${bundle.size}</strong><br>
      GH₵ ${bundle.price}
    </div>
    <button class="buy-btn">Buy</button>
  `;
  div.querySelector("button").onclick=()=>buyBundle(bundle);
  bundleList.appendChild(div);
});

async function buyBundle(bundle){
  const phone=document.getElementById("phone").value;
  const network=document.getElementById("network").value;

  if(!phone || !network){
    alert("Enter phone & network");
    return;
  }

  const walletRef=ref(db,"users/"+currentUser.uid+"/wallet");
  const snap=await get(walletRef);
  let balance=snap.val()||0;

  if(balance<bundle.price){
    alert("Insufficient balance");
    return;
  }

  balance-=bundle.price;
  await update(ref(db,"users/"+currentUser.uid),{
    wallet:balance
  });

  walletDisplay.innerText="GH₵ "+balance.toFixed(2);

  receipt.classList.add("show");
  setTimeout(()=>receipt.classList.remove("show"),3000);

  // Here is where real telecom API will be integrated
}

</script>

</body>
</html>
