<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>QWEN-911 Telecom</title>

<!-- Icons (SAME AS HOME MENU) -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>

/* ===============================
   GLOBAL FUTURISTIC STYLE
================================*/
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:black;
color:white;
overflow-x:hidden;
}

/* Animated Background */
body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background:
radial-gradient(circle,#00eaff22,transparent),
radial-gradient(circle,#7b2fff22,transparent);
animation:bgMove 18s linear infinite;
z-index:-1;
}

@keyframes bgMove{
0%{transform:translate(0,0)}
50%{transform:translate(-20%,-20%)}
100%{transform:translate(0,0)}
}

/* ===============================
HEADER DASHBOARD
================================*/
.header{
padding:18px;
text-align:center;
background:linear-gradient(90deg,#00eaff,#7b2fff);
font-weight:bold;
font-size:20px;
}

.stats{
display:flex;
justify-content:space-around;
padding:10px;
font-size:13px;
opacity:.9;
}

/* ===============================
CARDS
================================*/
.card{
margin:14px;
padding:18px;
border-radius:16px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(14px);
box-shadow:0 0 20px #00eaff33;
}

input,select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#111;
color:white;
}

button{
width:100%;
padding:13px;
margin-top:12px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00eaff,#7b2fff);
color:white;
font-weight:bold;
cursor:pointer;
}

/* ===============================
BUNDLES GRID
================================*/
.bundle-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.bundle{
padding:14px;
border-radius:12px;
background:#111;
text-align:center;
cursor:pointer;
transition:.3s;
}

.bundle:hover{
transform:scale(1.05);
box-shadow:0 0 12px #00eaff;
}

/* ===============================
TRANSACTIONS
================================*/
.tx{
font-size:12px;
padding:8px;
border-bottom:1px solid #333;
}

/* ===============================
FLOATING MENU BAR
================================*/
.menu{
position:fixed;
bottom:12px;
left:50%;
transform:translateX(-50%);
width:92%;
background:#111;
display:flex;
justify-content:space-around;
padding:12px;
border-radius:20px;
box-shadow:0 0 20px #00eaff55;
}

.menu i{
color:white;
font-size:26px;
cursor:pointer;
}

.active{
color:#00eaff;
}

</style>
</head>

<body>

<div class="header">QWEN-911 TELECOM</div>

<div class="stats">
<div id="username">User</div>
<div id="wallet">₵0</div>
<div id="online">0 online</div>
</div>

<!-- PHONE INPUT -->
<div class="card">
<h3>Buy Data Bundle</h3>

<input id="phone" placeholder="Enter Phone Number">

<select id="network">
<option>Auto Detect</option>
<option>MTN</option>
<option>Vodafone</option>
<option>AirtelTigo</option>
</select>

</div>

<!-- BUNDLES -->
<div class="card">
<h3>Available Bundles</h3>
<div class="bundle-grid" id="bundles"></div>
</div>

<!-- TRANSACTIONS -->
<div class="card">
<h3>Transactions</h3>
<div id="transactions"></div>
</div>

<!-- FLOATING MENU -->
<div class="menu">
<i class="material-icons" onclick="go('home.html')">home</i>
<i class="material-icons active">wifi</i>
<i class="material-icons" onclick="go('chat.html')">chat</i>
<i class="material-icons" onclick="go('profile.html')">person</i>
</div>

<!-- ===============================
FIREBASE
================================-->

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc,
collection,
addDoc,
onSnapshot
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* YOUR CONFIG */
const firebaseConfig = {
apiKey: "AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain: "qwen-911.firebaseapp.com",
projectId: "qwen-911",
storageBucket: "qwen-911.firebasestorage.app",
messagingSenderId: "518019892837",
appId: "1:518019892837:web:9972dd63d8dca7936ea88c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser;

/* ===============================
AUTH LOAD
================================*/
onAuthStateChanged(auth, async(user)=>{

if(!user) location.href="login.html";

currentUser=user;

const username=user.email.split("@")[0];
document.getElementById("username").innerText=username;

/* Create user if first time */
const ref=doc(db,"users",user.uid);
const snap=await getDoc(ref);

if(!snap.exists()){
await setDoc(ref,{
wallet:20,
online:true
});
}

/* Live wallet */
onSnapshot(ref,(d)=>{
document.getElementById("wallet")
.innerText="₵"+d.data().wallet;
});

/* Online counter */
onSnapshot(collection(db,"users"),(s)=>{
document.getElementById("online")
.innerText=s.size+" online";
});

loadBundles();
loadTransactions();

});

/* ===============================
NETWORK AUTO DETECT
================================*/
document.getElementById("phone")
.addEventListener("input",(e)=>{

const num=e.target.value;

let net="Auto Detect";

if(num.startsWith("024")||num.startsWith("054"))
net="MTN";
else if(num.startsWith("020"))
net="Vodafone";
else if(num.startsWith("026"))
net="AirtelTigo";

document.getElementById("network").value=net;
});

/* ===============================
LOAD BUNDLES
================================*/
function loadBundles(){

const bundleList=[
{name:"1GB",price:5},
{name:"2GB",price:9},
{name:"5GB",price:20},
{name:"10GB",price:35}
];

const box=document.getElementById("bundles");
box.innerHTML="";

bundleList.forEach(b=>{
const div=document.createElement("div");
div.className="bundle";
div.innerHTML=`${b.name}<br>₵${b.price}`;
div.onclick=()=>buyBundle(b);
box.appendChild(div);
});
}

/* ===============================
BUY BUNDLE
================================*/
async function buyBundle(bundle){

const ref=doc(db,"users",currentUser.uid);
const snap=await getDoc(ref);

let wallet=snap.data().wallet;

if(wallet<bundle.price){
alert("Insufficient balance");
return;
}

wallet-=bundle.price;

await updateDoc(ref,{wallet});

/* Save transaction */
await addDoc(collection(db,"transactions"),{
uid:currentUser.uid,
bundle:bundle.name,
price:bundle.price,
time:Date.now()
});

alert("Bundle Activated ⚡");
}

/* ===============================
TRANSACTIONS
================================*/
function loadTransactions(){

onSnapshot(collection(db,"transactions"),(snap)=>{

const box=document.getElementById("transactions");
box.innerHTML="";

snap.forEach(docu=>{
const t=docu.data();
if(t.uid!==currentUser.uid) return;

const div=document.createElement("div");
div.className="tx";
div.innerText=`${t.bundle} — ₵${t.price}`;
box.appendChild(div);
});
});
}

/* ===============================
NAVIGATION
================================*/
window.go=(page)=>{
location.href=page;
}

</script>

</body>
  </html>
