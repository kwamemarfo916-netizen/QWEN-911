<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QWEN-911 Data Bundles</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Inter,sans-serif;
background:#070912;
color:#fff;
padding-bottom:120px;
}

header{
text-align:center;
padding:14px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(15px);
}

.container{
padding:12px;
display:flex;
flex-direction:column;
gap:14px;
}

/* NETWORK CARDS */

.networks{
display:flex;
gap:10px;
}

.net{
flex:1;
padding:14px;
border-radius:14px;
text-align:center;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
cursor:pointer;
transition:.3s;
}

.net.active{
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
}

/* AMOUNTS */

.amounts{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.amount{
padding:12px;
text-align:center;
border-radius:12px;
background:rgba(255,255,255,.05);
cursor:pointer;
}

.amount.active{
background:#00f5ff;
color:#000;
}

.card{
background:rgba(255,255,255,.05);
padding:14px;
border-radius:14px;
}

.buyBtn{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#00f5ff,#a855f7);
font-size:16px;
font-weight:bold;
cursor:pointer;
}

#receipt{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
background:#111;
padding:20px;
border-radius:16px;
text-align:center;
transition:.4s;
}

.showReceipt{
transform:translate(-50%,-50%) scale(1);
}

.menu-bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:450px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(25px);
border-radius:35px;
display:flex;
justify-content:space-around;
padding:14px;
}

.menu-bar a{
color:#888;
font-size:22px;
flex:1;
text-align:center;
text-decoration:none;
}

.menu-bar a.active{
color:#00f5ff;
transform:translateY(-6px);
}

</style>
</head>

<body>

<header>
<h3>Buy Data Bundle</h3>
Balance: ₵<span id="balance">0</span>
</header>

<div class="container">

<div class="card">
<h4>Select Network</h4>
<div class="networks">
<div class="net" data-net="MTN">MTN</div>
<div class="net" data-net="Telecel">Telecel</div>
<div class="net" data-net="AirtelTigo">AT</div>
</div>
</div>

<div class="card">
<h4>Select Bundle</h4>
<div class="amounts">
<div class="amount">1GB - ₵5</div>
<div class="amount">2GB - ₵10</div>
<div class="amount">5GB - ₵20</div>
<div class="amount">10GB - ₵35</div>
<div class="amount">20GB - ₵60</div>
<div class="amount">50GB - ₵120</div>
</div>
</div>

<button class="buyBtn" id="buyBtn">
Buy Bundle
</button>

</div>

<div id="receipt">
<h3>✅ Purchase Successful</h3>
<p id="receiptText"></p>
</div>

<!-- MENU -->
<div class="menu-bar">
<a href="home.html"><i class="fa-solid fa-house"></i></a>
<a href="stream.html"><i class="fa-solid fa-video"></i></a>
<a href="data.html" class="active"><i class="fa-solid fa-sim-card"></i></a>
<a href="chat.html"><i class="fa-solid fa-comments"></i></a>
<a href="profile.html"><i class="fa-solid fa-user"></i></a>
</div>
   <a href="privacy.html">Privacy and Policy</a>
  <a href="terms.html">Terms and Conditions</a>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import{
getAuth,onAuthStateChanged
}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import{
getDatabase,ref,onValue,update,push,get
}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

/* FIREBASE */
const firebaseConfig={
apiKey:"AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain:"qwen-911.firebaseapp.com",
databaseURL:"https://qwen-911-default-rtdb.firebaseio.com",
projectId:"qwen-911"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

let selectedNet=null;
let selectedAmount=null;
let price=0;
let uid;

/* AUTH */
onAuthStateChanged(auth,user=>{
if(!user)return location.href="login.html";
uid=user.uid;

/* LOAD BALANCE */
onValue(ref(db,"users/"+uid+"/balance"),snap=>{
balance.textContent=snap.val()||0;
});
});

/* SELECT NETWORK */
document.querySelectorAll(".net").forEach(n=>{
n.onclick=()=>{
document.querySelectorAll(".net")
.forEach(x=>x.classList.remove("active"));
n.classList.add("active");
selectedNet=n.dataset.net;
};
});

/* SELECT AMOUNT */
document.querySelectorAll(".amount").forEach(a=>{
a.onclick=()=>{
document.querySelectorAll(".amount")
.forEach(x=>x.classList.remove("active"));
a.classList.add("active");

selectedAmount=a.innerText.split("-")[0];
price=parseFloat(a.innerText.split("₵")[1]);
};
});

/* BUY */
buyBtn.onclick=async()=>{

if(!selectedNet||!price)
return alert("Select bundle");

const balSnap=await get(ref(db,"users/"+uid+"/balance"));
let bal=balSnap.val()||0;

if(bal<price)
return alert("Insufficient balance");

let newBal=bal-price;

/* UPDATE USER */
update(ref(db,"users/"+uid),{
balance:newBal,
totalSpent:(balSnap.val()?.totalSpent||0)+price,
totalBuys:(balSnap.val()?.totalBuys||0)+1
});

/* SAVE PURCHASE */
push(ref(db,"purchases"),{
uid,
network:selectedNet,
bundle:selectedAmount,
price,
time:Date.now()
});

/* RECEIPT */
receiptText.innerText=
`${selectedNet} ${selectedAmount} purchased`;

receipt.classList.add("showReceipt");

setTimeout(()=>{
receipt.classList.remove("showReceipt");
},2500);
body
</script>
<script type="module" src="analytics.js"></script>
</body>
   </html>
