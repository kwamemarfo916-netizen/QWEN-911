<!DOCTYPE html>
<html>
<head>
<title>QWEN-911 Data Bundles</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0e1621;
color:white;
padding:15px;
}

/* Wallet */
.wallet{
background:#17212b;
padding:15px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.topup-btn{
background:aquamarine;
border:none;
padding:6px 12px;
border-radius:6px;
cursor:pointer;
}

/* Cards */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin:15px 0;
}

.card{
background:#17212b;
padding:15px;
border-radius:10px;
text-align:center;
cursor:pointer;
border:2px solid transparent;
}

.card.active{
border:2px solid aquamarine;
}

/* Inputs */
input{
width:100%;
padding:10px;
border-radius:8px;
border:none;
margin-bottom:10px;
}

button.buy{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:aquamarine;
font-weight:bold;
cursor:pointer;
}

/* Receipt Popup */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
display:none;
justify-content:center;
align-items:center;
}

.receipt{
background:#17212b;
padding:20px;
border-radius:15px;
width:80%;
max-width:350px;
animation:slideUp .3s ease;
}

@keyframes slideUp{
from{transform:translateY(50px);opacity:0;}
to{transform:translateY(0);opacity:1;}
}
</style>
</head>
<body>

<h2>💰 Wallet</h2>
<div class="wallet">
<span id="balance">Loading...</span>
<button class="topup-btn" id="topupBtn">Top Up</button>
</div>

<h2>📡 Select Network</h2>
<div class="grid" id="networks">
<div class="card" data-network="MTN">MTN</div>
<div class="card" data-network="Vodafone">Vodafone</div>
<div class="card" data-network="AirtelTigo">AirtelTigo</div>
<div class="card" data-network="Glo">Glo</div>
</div>

<h2>📦 Select Bundle</h2>
<div class="grid" id="bundles">
<div class="card" data-amount="5">1GB - GHS 5</div>
<div class="card" data-amount="10">2GB - GHS 10</div>
<div class="card" data-amount="20">5GB - GHS 20</div>
<div class="card" data-amount="40">10GB - GHS 40</div>
</div>

<input id="phone" placeholder="Enter phone number">
<button class="buy" id="buyBtn">Buy Data</button>

<!-- Receipt -->
<div class="overlay" id="receiptOverlay">
<div class="receipt" id="receiptBox">
<h3>✅ Purchase Successful</h3>
<p id="receiptDetails"></p>
<button onclick="closeReceipt()" class="buy">Done</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, push, update } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain: "qwen-911.firebaseapp.com",
databaseURL: "https://qwen-911-default-rtdb.firebaseio.com",
projectId: "qwen-911",
storageBucket: "qwen-911.firebasestorage.app",
messagingSenderId: "518019892837",
appId: "1:518019892837:web:9972dd63d8dca7936ea88c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth();

const balanceEl = document.getElementById("balance");
let userId=null;
let balance=0;

/* AUTH STATE */
onAuthStateChanged(auth, async user=>{
    if(user){
        userId=user.uid;
        await loadWallet();
    }else{
        window.location.href="login.html"; // redirect if not logged in
    }
});

/* Load Wallet */
async function loadWallet(){
    const snap = await get(ref(db,"users/"+userId+"/balance"));
    if(snap.exists()){
        balance = snap.val();
    }else{
        balance = 100; // initial balance
        await set(ref(db,"users/"+userId),{balance:100});
    }
    balanceEl.textContent = "GHS " + balance.toFixed(2);
}

/* Selection Logic */
let selectedNetwork=null;
let selectedAmount=null;

document.querySelectorAll("#networks .card").forEach(card=>{
card.onclick=()=>{
document.querySelectorAll("#networks .card").forEach(c=>c.classList.remove("active"));
card.classList.add("active");
selectedNetwork=card.dataset.network;
};
});

document.querySelectorAll("#bundles .card").forEach(card=>{
card.onclick=()=>{
document.querySelectorAll("#bundles .card").forEach(c=>c.classList.remove("active"));
card.classList.add("active");
selectedAmount=Number(card.dataset.amount);
};
});

/* Buy Data */
document.getElementById("buyBtn").onclick=async ()=>{
    const phone=document.getElementById("phone").value;
    if(!selectedNetwork||!selectedAmount||!phone){
        alert("Complete all fields");
        return;
    }
    if(balance<selectedAmount){
        alert("Insufficient balance");
        return;
    }

    balance -= selectedAmount;
    await update(ref(db,"users/"+userId),{balance});
    balanceEl.textContent = "GHS "+balance.toFixed(2);

    const transactionId="TX"+Date.now();

    await push(ref(db,"transactions/"+userId),{
        network:selectedNetwork,
        amount:selectedAmount,
        phone,
        transactionId,
        date:new Date().toLocaleString()
    });

    showReceipt(selectedNetwork,selectedAmount,phone,transactionId);
};

/* Top-Up Wallet */
document.getElementById("topupBtn").onclick=async ()=>{
    const amount=prompt("Enter top up amount:");
    if(!amount||isNaN(amount)) return;
    balance += Number(amount);
    await update(ref(db,"users/"+userId),{balance});
    balanceEl.textContent="GHS "+balance.toFixed(2);

    await push(ref(db,"topups/"+userId),{
        amount:Number(amount),
        date:new Date().toLocaleString()
    });

    alert("Wallet funded successfully!");
};

/* Receipt */
function showReceipt(network,amount,phone,tx){
    document.getElementById("receiptDetails").innerHTML=
    `Network: ${network}<br>
     Amount: GHS ${amount}<br>
     Phone: ${phone}<br>
     Transaction ID: ${tx}`;
    document.getElementById("receiptOverlay").style.display="flex";
}

window.closeReceipt=function(){
    document.getElementById("receiptOverlay").style.display="none";
}
</script>

</body>
  </html>
