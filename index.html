<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - QWEN-911</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0b0f1a;
  --panel: #11162a;
  --text: #eaeaf0;
  --muted: #9aa1b2;
  --accent: linear-gradient(120deg, #3b82f6, #8b5cf6, #2dd4bf);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Inter", sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* LOGIN BOX */
.login-box {
  background: var(--panel);
  padding: 40px;
  border-radius: 20px;
  width: 320px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.logo {
  width: 50px;
  height: 50px;
  border-radius: 14px;
  margin: 0 auto 20px;
  background: var(--accent);
  animation: spin 6s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

h2 {
  margin-bottom: 10px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: none;
  border-radius: 10px;
  background: #1a2040;
  color: white;
  font-size: 0.95rem;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  color: white;
  font-size: 1rem;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: translateY(-2px);
}

footer {
  margin-top: 25px;
  font-size: 0.8rem;
  color: var(--muted);
}
</style>
</head>

<body>

<div class="login-box">
  <div class="logo"></div>
  <h2>QWEN-911</h2>

  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">

  <!-- Login button -->
  <a href="home.html">
    <button>Login</button>
  </a>
  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
  authDomain: "qwen-911.firebaseapp.com",
  projectId: "qwen-911",
  storageBucket: "qwen-911.firebasestorage.app",
  messagingSenderId: "518019892837",
  appId: "1:518019892837:web:9972dd63d8dca7936ea88c",
  measurementId: "G-0LZW0FZ3Q0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, user => {
  if (!user) {
    window.location.href = "index.html";
  } else {
    document.getElementById("user").innerText =
      "Welcome, " + user.email;
  }
});

window.logout = () => {
  signOut(auth).then(() => {
    window.location.href = "index.html";
  });
};
  </script>

  <footer>Powered by STARIS Inc.</footer>
</div>

</body>
</html>
