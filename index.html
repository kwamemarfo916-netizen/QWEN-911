<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - QWEN-911</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.login-box{
  width:90%;
  max-width:400px;
  background:rgba(0,0,0,0.6);
  padding:30px;
  border-radius:20px;
  backdrop-filter:blur(10px);
  color:white;
}

.login-box h2{
  text-align:center;
  margin-bottom:20px;
}

.login-box input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:none;
  border-radius:25px;
  outline:none;
}

.login-box button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:25px;
  font-weight:600;
  cursor:pointer;
  margin-bottom:10px;
}

/* BUTTON STYLES */
.signup-btn{
  background:#28a745;
  color:white;
}

.login-btn{
  background:#00c6ff;
  color:white;
}

.google-btn{
  background:white;
  color:#333;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

hr{
  margin:20px 0;
  opacity:.3;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>QWEN-911</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <!-- SIGN UP BUTTON -->
  <button class="signup-btn" onclick="signup()">Sign Up</button>

  <!-- LOGIN BUTTON -->
  <button class="login-btn" onclick="login()">Login</button>

  <!-- GOOGLE BUTTON (UNDER LOGIN) -->
  <button id="googleLogin" class="google-btn">
    <i class="fa-brands fa-google"></i>
    Continue with Google
  </button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  createUserWithEmailAndPassword,
  sendEmailVerification,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

/* YOUR FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain: "qwen-911.firebaseapp.com",
databaseURL: "https://qwen-911-default-rtdb.firebaseio.com",
projectId: "qwen-911",
storageBucket: "qwen-911.firebasestorage.app",
messagingSenderId: "518019892837",
appId: "1:518019892837:web:9972dd63d8dca7936ea88c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* SIGN UP */
window.signup = async function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try{
    const userCredential = await createUserWithEmailAndPassword(auth,email,password);
    await sendEmailVerification(userCredential.user);
    alert("Account created! Verification email sent. Please check your inbox.");
  }catch(error){
    alert(error.message);
  }
}

/* LOGIN */
window.login = async function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try{
    const userCredential = await signInWithEmailAndPassword(auth,email,password);

    if(!userCredential.user.emailVerified){
      alert("Please verify your email before logging in.");
      return;
    }

    window.location.href="home.html";

  }catch(error){
    alert(error.message);
  }
}

/* GOOGLE LOGIN */
document.getElementById("googleLogin").addEventListener("click", async ()=>{
  const provider = new GoogleAuthProvider();
  try{
    await signInWithPopup(auth,provider);
    window.location.href="home.html";
  }catch(error){
    alert(error.message);
  }
});
</script>

</body>
</html>
