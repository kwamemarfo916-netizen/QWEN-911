<!DOCTYPE html>
<html>
<head>
  <title>QWEN-911 Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
   href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#001f3f,#3a0ca3);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:white;
    }

    .card{
      width:90%;
      max-width:350px;
      background:rgba(255,255,255,0.1);
      padding:25px;
      border-radius:20px;
      backdrop-filter:blur(15px);
      text-align:center;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:25px;
      outline:none;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:15px;
      border:none;
      border-radius:25px;
      font-weight:bold;
      cursor:pointer;
    }

    .login-btn{
      background:#00f5ff;
      color:black;
    }

    .google-btn{
      background:white;
      color:black;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    #resendBtn{
      display:none;
      background:#ff9800;
      color:white;
    }

    #message{
      margin-top:10px;
      color:#ffcc00;
      font-size:14px;
    }

  </style>
</head>
<body>

<div class="card">
  <h2>QWEN-911</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button class="login-btn" id="loginBtn">
    Login
  </button>

  <div id="message"></div>

  <button id="resendBtn">
    Resend Verification Email
  </button>

  <button class="google-btn" id="googleLogin">
    <i class="fa-brands fa-google"></i>
    Continue with Google
  </button>

</div>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import { 
  getAuth, 
  signInWithEmailAndPassword, 
  sendEmailVerification,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
  authDomain: "qwen-911.firebaseapp.com",
  databaseURL: "https://qwen-911-default-rtdb.firebaseio.com",
  projectId: "qwen-911",
  storageBucket: "qwen-911.firebasestorage.app",
  messagingSenderId: "518019892837",
  appId: "1:518019892837:web:9972dd63d8dca7936ea88c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginBtn = document.getElementById("loginBtn");
const resendBtn = document.getElementById("resendBtn");
const messageBox = document.getElementById("message");

let currentUser;

/* EMAIL LOGIN */
loginBtn.addEventListener("click", async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {

    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    await userCredential.user.reload();

    currentUser = userCredential.user;

    if (!currentUser.emailVerified) {

      messageBox.innerHTML = "⚠️ Please verify your email.";
      resendBtn.style.display = "block";
      return;
    }

    window.location.href = "home.html";

  } catch (error) {
    alert(error.message);
  }

});

/* RESEND VERIFICATION */
resendBtn.addEventListener("click", async () => {

  if (!currentUser) return;

  try {
    await sendEmailVerification(currentUser);
    alert("Verification link sent again. Check your inbox.");
  } catch (error) {
    alert(error.message);
  }

});

/* GOOGLE LOGIN */
document.getElementById("googleLogin")
.addEventListener("click", async () => {

  const provider = new GoogleAuthProvider();

  try {
    await signInWithPopup(auth, provider);
    window.location.href = "home.html";
  } catch (error) {
    alert(error.message);
  }

});

</script>

</body>
</html>
