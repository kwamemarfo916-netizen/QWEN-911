<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWEN-911 Admin</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Inter,sans-serif;
background:#070810;
color:#fff;
padding-bottom:120px;
}

header{
text-align:center;
padding:14px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(15px);
border-bottom:1px solid rgba(255,255,255,.06);
}

.container{
padding:15px;
display:flex;
flex-direction:column;
gap:14px;
}

.card{
background:rgba(255,255,255,.05);
border-radius:16px;
padding:14px;
border:1px solid rgba(255,255,255,.08);
}

.stat{
font-size:22px;
color:#00f5ff;
margin-top:6px;
}

/* menu bar same as others */
.menu-bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:450px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(25px);
border-radius:35px;
display:flex;
justify-content:space-around;
padding:14px 5px;
box-shadow:0 0 20px rgba(0,245,255,.3);
}

.menu-bar a{
color:#888;
font-size:22px;
flex:1;
text-align:center;
text-decoration:none;
}

</style>
</head>

<body>

<header>
<h3>Admin Dashboard</h3>
</header>

<div class="container">

<div class="card">
<div>Total App Opens</div>
<div id="opens" class="stat">0</div>
</div>

<div class="card">
<div>Total Messages Sent</div>
<div id="messages" class="stat">0</div>
</div>

<div class="card">
<div>Total Page Views</div>
<div id="views" class="stat">0</div>
</div>

</div>

<div class="menu-bar">
<a href="home.html"><i class="fa-solid fa-house"></i></a>
<a href="stream.html"><i class="fa-solid fa-video"></i></a>
<a href="data.html"><i class="fa-solid fa-sim-card"></i></a>
<a href="chat.html"><i class="fa-solid fa-comments"></i></a>
<a href="profile.html"><i class="fa-solid fa-user"></i></a>
</div>
  <script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://qagawtgfpfupobwuotvw.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhZ2F3dGdmcGZ1cG9id3VvdHZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMDIzNzYsImV4cCI6MjA4Nzg3ODM3Nn0.-ocXPElc-S6aPlqpJBr0-Fvhv8rvaxEDnWKbw5C4dD4"
);

async function loadStats(){

const { data } =
await supabase.from("analytics_events").select("event_type");

let opens=0, messages=0, views=0;

data.forEach(e=>{
if(e.event_type==="APP_OPEN") opens++;
if(e.event_type==="MESSAGE_SENT") messages++;
if(e.event_type==="PAGE_VIEW") views++;
});

document.getElementById("opens").textContent=opens;
document.getElementById("messages").textContent=messages;
document.getElementById("views").textContent=views;
}

loadStats();

  </script>

<script type="module" src="analytics.js"></script>

</body>
</html>
