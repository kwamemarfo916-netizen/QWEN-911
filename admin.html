<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWEN-911 SUPER ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Inter,sans-serif;
background:#05060c;
color:#fff;
padding-bottom:120px;
}

header{
text-align:center;
padding:14px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(15px);
}

.container{
padding:12px;
display:flex;
flex-direction:column;
gap:12px;
}

.card{
background:rgba(255,255,255,.05);
border-radius:16px;
padding:14px;
border:1px solid rgba(255,255,255,.08);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
font-size:22px;
color:#00f5ff;
}

input,button{
width:100%;
padding:10px;
margin-top:8px;
border-radius:12px;
border:none;
}

button{
background:linear-gradient(135deg,#00f5ff,#a855f7);
font-weight:bold;
cursor:pointer;
}

.menu-bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:450px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(25px);
border-radius:35px;
display:flex;
justify-content:space-around;
padding:14px;
}

.menu-bar a{
color:#888;
font-size:22px;
flex:1;
text-align:center;
text-decoration:none;
}

</style>
</head>

<body>

<header>
<h3>SUPER ADMIN CONTROL</h3>
</header>

<div class="container">

<!-- STATS -->
<div class="card grid">
<div>Users<br><span class="stat" id="usersCount">0</span></div>
<div>Online<br><span class="stat" id="onlineCount">0</span></div>
<div>Revenue ₵<br><span class="stat" id="revenue">0</span></div>
<div>Transactions<br><span class="stat" id="txCount">0</span></div>
</div>

<!-- CHART -->
<div class="card">
<canvas id="revenueChart"></canvas>
</div>

<!-- USER CONTROL -->
<div class="card">
<h4>User Control</h4>
<input id="uid" placeholder="User UID">
<input id="amount" placeholder="Amount">
<button id="addBal">Add Balance</button>
<button id="deductBal">Deduct Balance</button>
</div>

<!-- PLATFORM CONTROL -->
<div class="card">
<h4>Platform Controls</h4>

<button id="maintenanceBtn">Toggle Maintenance Mode</button>
<button id="disableChatBtn">Toggle Chat</button>

<input id="announcement" placeholder="Broadcast message">
<button id="broadcast">Send Announcement</button>
</div>

</div>

<!-- FLOAT MENU -->
<div class="menu-bar">
<a href="home.html"><i class="fa-solid fa-house"></i></a>
<a href="stream.html"><i class="fa-solid fa-video"></i></a>
<a href="data.html"><i class="fa-solid fa-sim-card"></i></a>
<a href="chat.html"><i class="fa-solid fa-comments"></i></a>
<a href="profile.html"><i class="fa-solid fa-user"></i></a>
</div>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import{
getAuth,onAuthStateChanged
}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import{
getDatabase,ref,onValue,update,push,set
}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain:"qwen-911.firebaseapp.com",
databaseURL:"https://qwen-911-default-rtdb.firebaseio.com",
projectId:"qwen-911"
};

const ADMIN="kwamemarfo916@gmail.com";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

/* ADMIN LOCK */
onAuthStateChanged(auth,user=>{
if(!user||user.email!==ADMIN)
location.href="home.html";
});

/* LIVE USERS */
onValue(ref(db,"users"),snap=>{
if(!snap.exists())return;

let users=snap.val();
usersCount.textContent=Object.keys(users).length;

let revenue=0,tx=0;

Object.values(users).forEach(u=>{
revenue+=u.totalSpent||0;
tx+=u.totalBuys||0;
});

revenueEl(revenue,tx);
});

function revenueEl(rev,tx){
revenue.textContent=rev.toFixed(2);
txCount.textContent=tx;
updateChart(rev);
}

/* ONLINE */
onValue(ref(db,"online"),snap=>{
onlineCount.textContent=
snap.exists()?Object.keys(snap.val()).length:0;
});

/* BALANCE CONTROL */
addBal.onclick=()=>{
update(ref(db,"users/"+uid.value),{
balance:parseFloat(amount.value)
});
logAdmin("Added balance");
};

deductBal.onclick=()=>{
update(ref(db,"users/"+uid.value),{balance:0});
logAdmin("Removed balance");
};

/* BROADCAST */
broadcast.onclick=()=>{
push(ref(db,"announcements"),{
text:announcement.value,
time:Date.now()
});
announcement.value="";
};

/* PLATFORM TOGGLES */
maintenanceBtn.onclick=()=>{
set(ref(db,"settings/maintenance"),true);
};

disableChatBtn.onclick=()=>{
set(ref(db,"settings/chatDisabled"),true);
};

/* ADMIN LOG */
function logAdmin(action){
push(ref(db,"adminLogs"),{
action,
time:Date.now()
});
}

/* CHART */
const ctx=document.getElementById("revenueChart");
const chart=new Chart(ctx,{
type:"line",
data:{
labels:["Now"],
datasets:[{data:[0]}]
}
});

function updateChart(val){
chart.data.datasets[0].data.push(val);
chart.data.labels.push("");
chart.update();
}

</script>

</body>
  </html>
