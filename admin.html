<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QWEN-911 Admin Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Inter;
background:#05060c;
color:#fff;
}

header{
text-align:center;
padding:16px;
background:rgba(15,15,25,.9);
border-bottom:1px solid rgba(255,255,255,.06);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:12px;
padding:14px;
}

.card{
background:rgba(255,255,255,.05);
border-radius:16px;
padding:14px;
border:1px solid rgba(255,255,255,.07);
}

.big{
font-size:20px;
margin-top:5px;
}

.users{
padding:14px;
}

.userRow{
display:flex;
justify-content:space-between;
padding:10px;
border-bottom:1px solid rgba(255,255,255,.05);
font-size:13px;
}

</style>
</head>

<body>

<header>
<h3>ADMIN CONTROL CENTER</h3>
</header>

<div class="grid">

<div class="card">
Total Users
<div class="big" id="totalUsers">0</div>
</div>

<div class="card">
Total Purchases
<div class="big" id="totalPurchases">0</div>
</div>

<div class="card">
Money Received (₵)
<div class="big" id="moneyReceived">0</div>
</div>

<div class="card">
Active Online
<div class="big" id="onlineUsers">0</div>
</div>

</div>

<div class="users">
<h4>User Balances</h4>
<div id="usersList"></div>
</div>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import{
getAuth,onAuthStateChanged
}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import{
getDatabase,ref,onValue
}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain:"qwen-911.firebaseapp.com",
databaseURL:"https://qwen-911-default-rtdb.firebaseio.com",
projectId:"qwen-911"
};

const ADMIN_EMAIL="kwamemarfo916@gmail.com";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

/* ADMIN PROTECTION */
onAuthStateChanged(auth,user=>{

if(!user || user.email!==ADMIN_EMAIL){
alert("Admin access only");
location.href="home.html";
return;
}

/* USERS DATA */

onValue(ref(db,"users"),snap=>{

if(!snap.exists())return;

let users=snap.val();
let totalMoney=0;
let totalBuys=0;
let count=0;

usersList.innerHTML="";

Object.entries(users).forEach(([uid,data])=>{

count++;
totalMoney+=data.totalSpent||0;
totalBuys+=data.totalBuys||0;

const row=document.createElement("div");
row.className="userRow";

row.innerHTML=`
<span>${data.email || uid}</span>
<span>₵ ${(data.balance||0).toFixed(2)}</span>
`;

usersList.appendChild(row);

});

totalUsers.textContent=count;
totalPurchases.textContent=totalBuys;
moneyReceived.textContent=totalMoney.toFixed(2);

});

/* ONLINE USERS */
onValue(ref(db,"online"),snap=>{
onlineUsers.textContent=
snap.exists()?Object.keys(snap.val()).length:0;
});

});

</script>
</body>
                        </html>
