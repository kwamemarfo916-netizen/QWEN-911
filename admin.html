<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWEN-911 Admin</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Inter,sans-serif;
background:#070810;
color:#fff;
padding-bottom:120px;
}

header{
text-align:center;
padding:14px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(15px);
border-bottom:1px solid rgba(255,255,255,.06);
}

.container{
padding:15px;
display:flex;
flex-direction:column;
gap:14px;
}

.card{
background:rgba(255,255,255,.05);
border-radius:16px;
padding:14px;
border:1px solid rgba(255,255,255,.08);
}

.stat{
font-size:22px;
color:#00f5ff;
margin-top:6px;
}

/* LIVE FEED */
.feed{
margin-top:10px;
display:flex;
flex-direction:column;
gap:8px;
max-height:320px;
overflow:auto;
font-size:13px;
color:#ccc;
}

.feed-item{
padding:8px;
border-radius:10px;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.06);
}

/* menu bar */
.menu-bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:450px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(25px);
border-radius:35px;
display:flex;
justify-content:space-around;
padding:14px 5px;
box-shadow:0 0 20px rgba(0,245,255,.3);
}

.menu-bar a{
color:#888;
font-size:22px;
flex:1;
text-align:center;
text-decoration:none;
}

</style>
</head>

<body>

<header>
<h3>Admin Dashboard</h3>
</header>

<div class="container">

<div class="card">
<div>Total App Opens</div>
<div id="opens" class="stat">0</div>
</div>

<div class="card">
<div>Total Messages Sent</div>
<div id="messages" class="stat">0</div>
</div>

<div class="card">
<div>Total Page Views</div>
<div id="views" class="stat">0</div>
</div>

<!-- LIVE ACTIVITY -->
<div class="card">
<div>Live Activity</div>
<div id="liveFeed" class="feed"></div>
</div>

</div>

<div class="menu-bar">
<a href="home.html"><i class="fa-solid fa-house"></i></a>
<a href="stream.html"><i class="fa-solid fa-video"></i></a>
<a href="data.html"><i class="fa-solid fa-sim-card"></i></a>
<a href="chat.html"><i class="fa-solid fa-comments"></i></a>
<a href="profile.html"><i class="fa-solid fa-user"></i></a>
</div>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* =========================
   SUPABASE CONNECTION
========================= */

const supabase = createClient(
"https://qagawtgfpfupobwuotvw.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhZ2F3dGdmcGZ1cG9id3VvdHZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMDIzNzYsImV4cCI6MjA4Nzg"
);

/* =========================
   STATS COUNTERS
========================= */

let stats = {
APP_OPEN:0,
MESSAGE_SENT:0,
PAGE_VIEW:0,
DATA_PURCHASE:0,
WALLET_TOPUP:0,
STREAM_JOIN:0,
PROFILE_VIEW:0
};

function updateUI(){
document.getElementById("opens").textContent = stats.APP_OPEN;
document.getElementById("messages").textContent = stats.MESSAGE_SENT;
document.getElementById("views").textContent = stats.PAGE_VIEW;
}

/* =========================
   LOAD ALL STATS
========================= */

async function loadStats(){

const { data } =
await supabase.from("analytics_events")
.select("event_type");

data.forEach(e=>{
if(stats[e.event_type] !== undefined){
stats[e.event_type]++;
}
});

updateUI();
}

loadStats();

/* =========================
   LIVE FEED RENDER
========================= */

function addFeedItem(event){

const feed = document.getElementById("liveFeed");

const row = document.createElement("div");
row.className="feed-item";

const time =
new Date(event.created_at)
.toLocaleTimeString();

row.innerHTML = `
<b style="color:#00f5ff">${event.username || "guest"}</b>
→ ${event.event_type}
<div style="opacity:.6;font-size:11px">${time}</div>
`;

feed.prepend(row);

/* keep only latest 20 */
if(feed.children.length>20){
feed.removeChild(feed.lastChild);
}

/* update stat live */
if(stats[event.event_type] !== undefined){
stats[event.event_type]++;
updateUI();
}

}

/* =========================
   LOAD INITIAL FEED
========================= */

async function loadInitialFeed(){

const { data } = await supabase
.from("analytics_events")
.select("*")
.order("created_at",{ascending:false})
.limit(20);

data.reverse().forEach(addFeedItem);
}

loadInitialFeed();

/* =========================
   REALTIME SUBSCRIPTION
========================= */

supabase
.channel("analytics-live")
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"analytics_events"
},
(payload)=>{
addFeedItem(payload.new);
}
)
.subscribe();

</script>
<script type="module" src="analytics.js"></script>

</body>
  </html>
