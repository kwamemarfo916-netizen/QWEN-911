<!DOCTYPE html>
<html>
<head>
  <title>QWEN-911 Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Icons -->
  <link rel="stylesheet"
   href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background-color: black;
      background-size:400% 400%;
      animation: gradientMove 8s ease infinite;
      padding-bottom:90px;
    }

    @keyframes gradientMove{
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }

    .container{
      padding:20px;
    }

    h1{
      text-align:center;
    }

    .card{
      background:rgba(255,255,255,0.1);
      padding:15px;
      border-radius:15px;
      margin-top:15px;
      backdrop-filter:blur(10px);
    }

    /* FLOATING MENU */
    .menu-bar{
      position:fixed;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      width:90%;
      max-width:420px;
      background:rgba(0,0,0,0.7);
      backdrop-filter:blur(20px);
      border-radius:30px;
      display:flex;
      justify-content:space-around;
      padding:12px 5px;
      box-shadow:0 5px 25px rgba(0,0,0,0.4);
    }

    .menu-bar a{
      text-decoration:none;
      color:#ccc;
      font-size:20px;
      text-align:center;
      flex:1;
      transition:0.3s;
    }

    .menu-bar a.active{
      color:#00f5ff;
      transform:translateY(-5px);
    }

    .menu-bar a:hover{
      color:white;
    }

    .logout-btn{
      margin-top:20px;
      width:100%;
      padding:10px;
      border:none;
      border-radius:20px;
      background:#ff4d4d;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

  </style>
</head>
<body>

<div class="container">
  <h1>Welcome to QWEN-911</h1>

  <div class="card">
    <h3>Live Chat</h3>
    <p>Connect with users in real-time.</p>
  </div>

  <div class="card">
    <h3>Data Bundles</h3>
    <p>Buy telecom bundles instantly.</p>
  </div>

  <div class="card">
    <h3>Streaming</h3>
    <p>Watch live streams and media.</p>
  </div>

  <button id="logoutBtn" class="logout-btn">
    Logout
  </button>
</div>

<!-- FLOATING MENU -->
<div class="menu-bar">
  <a href="home.html" class="active">
    <i class="fa-solid fa-house"></i>
  </a>
  <a href="stream.html">
    <i class="fa-solid fa-video"></i>
  </a>
  <a href="data.html">
    <i class="fa-solid fa-sim-card"></i>
  </a>
  <a href="chat.html">
    <i class="fa-solid fa-comments"></i>
  </a>
  <a href="profile.html">
    <i class="fa-solid fa-user"></i>
  </a>
</div>
  <a href="privacy.html">privacy and policy</a>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
  authDomain: "qwen-911.firebaseapp.com",
  databaseURL: "https://qwen-911-default-rtdb.firebaseio.com",
  projectId: "qwen-911",
  storageBucket: "qwen-911.firebasestorage.app",
  messagingSenderId: "518019892837",
  appId: "1:518019892837:web:9972dd63d8dca7936ea88c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user)=>{
  {
    window.location.href = "login.html";
  }
});

document.getElementById("logoutBtn")
.addEventListener("click", async ()=>{
  await signOut(auth);
  window.location.href = "login.html";
});

</script>

</body>
  </html>
