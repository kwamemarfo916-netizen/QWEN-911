<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWEN-911 Profile</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Inter,sans-serif;
background:#070810;
color:#fff;
padding-bottom:120px;
}

/* HEADER */

header{
text-align:center;
padding:14px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(15px);
border-bottom:1px solid rgba(255,255,255,.06);
}

/* PROFILE HEADER */

.profile-top{
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
padding:20px;
}

.avatar{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:3px solid #00f5ff;
box-shadow:0 0 15px rgba(0,245,255,.5);
}

.bio{
font-size:13px;
opacity:.8;
text-align:center;
max-width:250px;
}

.edit-btn{
background:linear-gradient(135deg,#00f5ff,#a855f7);
border:none;
padding:6px 12px;
border-radius:12px;
cursor:pointer;
color:#000;
font-size:12px;
}

/* CONTENT */

.container{
padding:15px;
display:flex;
flex-direction:column;
gap:14px;
}

.card{
background:rgba(255,255,255,.05);
border-radius:16px;
padding:14px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 0 15px rgba(0,245,255,.08);
}

.title{
font-size:12px;
opacity:.7;
margin-bottom:5px;
}

.value{
font-size:15px;
word-break:break-all;
}

.stats{
display:flex;
justify-content:space-between;
text-align:center;
}

.stat-number{
font-size:18px;
font-weight:600;
}

.stat-label{
font-size:11px;
opacity:.6;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:14px;
margin-top:10px;
font-weight:600;
cursor:pointer;
}

.primary{
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
}

.admin{
background:linear-gradient(135deg,#ffb300,#ff0066);
color:#000;
}

.logout{
background:#ff3b3b;
color:#fff;
}

.hidden{display:none;}

/* MENU BAR */

.menu-bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:450px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(25px);
border-radius:35px;
display:flex;
justify-content:space-around;
padding:14px 5px;
box-shadow:0 0 20px rgba(0,245,255,.3);
}

.menu-bar a{
color:#888;
font-size:22px;
flex:1;
text-align:center;
text-decoration:none;
}

.menu-bar a.active{
color:#00f5ff;
transform:translateY(-6px);
}

</style>
</head>

<body>

<header>
<h3>My Profile</h3>
</header>

<!-- PROFILE TOP -->
<div class="profile-top">

<img id="profilePhoto"
class="avatar"
src="https://i.imgur.com/2DhmtJ4.png">

<input type="file" id="photoInput" hidden>

<h3 id="username"></h3>

<div class="bio" id="bioText">
No bio yet
</div>

<button class="edit-btn" id="editProfile">
Edit Profile
</button>

</div>

<div class="container">

<div class="card">
<div class="stats">

<div>
<div class="stat-number" id="balance">0</div>
<div class="stat-label">Balance</div>
</div>

<div>
<div class="stat-number" id="totalBuys">0</div>
<div class="stat-label">Purchases</div>
</div>

<div>
<div class="stat-number" id="userID"></div>
<div class="stat-label">User ID</div>
</div>

</div>
</div>

<div class="card">
<div class="title">Email</div>
<div class="value" id="userEmail"></div>
</div>

<div class="card">

<button id="adminBtn" class="admin hidden">
Open Admin Dashboard
</button>

<button id="logoutBtn" class="logout">
Logout
</button>

</div>

</div>

<div class="menu-bar">
<a href="home.html"><i class="fa-solid fa-house"></i></a>
<a href="stream.html"><i class="fa-solid fa-video"></i></a>
<a href="data.html"><i class="fa-solid fa-sim-card"></i></a>
<a href="chat.html"><i class="fa-solid fa-comments"></i></a>
<a href="profile.html" class="active"><i class="fa-solid fa-user"></i></a>
</div>

<a href="privacy.html">Privacy and Policy</a>
<a href="terms.html">Terms and Conditions</a>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import{
getAuth,onAuthStateChanged,signOut
}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import{
getDatabase,ref,onValue,set,update,onDisconnect
}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

import{
getStorage,ref as sRef,uploadBytes,getDownloadURL
}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";

const firebaseConfig={
apiKey:"AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain:"qwen-911.firebaseapp.com",
databaseURL:"https://qwen-911-default-rtdb.firebaseio.com",
projectId:"qwen-911",
storageBucket:"qwen-911.appspot.com"
};

const ADMIN_EMAIL="kwamemarfo916@gmail.com";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const storage=getStorage(app);

onAuthStateChanged(auth,user=>{

if(!user){
location.href="index.html";
return;
}

userEmail.textContent=user.email;
username.textContent=user.email.split("@")[0];
userID.textContent=user.uid.slice(0,6);

const userRef=ref(db,"users/"+user.uid);

onValue(userRef,snap=>{

if(!snap.exists()){

set(userRef,{
balance:0,
totalBuys:0,
bio:"",
photo:"",
createdAt:Date.now()
});

return;
}

const d=snap.val();

balance.textContent=Number(d.balance||0).toFixed(2);
totalBuys.textContent=d.totalBuys||0;

if(d.bio) bioText.textContent=d.bio;
if(d.photo) profilePhoto.src=d.photo;

});

if(user.email===ADMIN_EMAIL){
adminBtn.classList.remove("hidden");
}

});

/* EDIT PROFILE */

editProfile.onclick=()=>{

const newName=prompt("New username",username.textContent);
const newBio=prompt("New bio",bioText.textContent);

if(newName){
username.textContent=newName;
}

if(newBio){
bioText.textContent=newBio;
}

const user=auth.currentUser;

update(ref(db,"users/"+user.uid),{
username:newName,
bio:newBio
});

photoInput.click();

};

/* PHOTO UPLOAD */

photoInput.onchange=async e=>{

const file=e.target.files[0];
if(!file)return;

const user=auth.currentUser;

const fileRef=sRef(storage,"profilePhotos/"+user.uid);

await uploadBytes(fileRef,file);

const url=await getDownloadURL(fileRef);

profilePhoto.src=url;

update(ref(db,"users/"+user.uid),{
photo:url
});

};

/* BUTTONS */

adminBtn.onclick=()=>{
location.href="admin.html";
};

logoutBtn.onclick=()=>{
signOut(auth).then(()=>{
location.href="index.html";
});
};

</script>

<script type="module" src="analytics.js"></script>

</body>
  </html>
