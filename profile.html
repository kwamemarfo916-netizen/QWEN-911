<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWEN-911 Profile</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Inter,sans-serif;
background:#070810;
color:#fff;
padding-bottom:120px;
}

/* HEADER */
header{
text-align:center;
padding:14px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(15px);
border-bottom:1px solid rgba(255,255,255,.06);
}

/* CONTENT */
.container{
padding:15px;
display:flex;
flex-direction:column;
gap:14px;
}

.card{
background:rgba(255,255,255,.05);
border-radius:16px;
padding:14px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 0 15px rgba(0,245,255,.08);
}

.title{
font-size:12px;
opacity:.7;
margin-bottom:5px;
}

.value{
font-size:15px;
word-break:break-all;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:14px;
margin-top:10px;
font-weight:600;
cursor:pointer;
}

.primary{
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
}

.admin{
background:linear-gradient(135deg,#ffb300,#ff0066);
color:#000;
}

.logout{
background:#ff3b3b;
color:#fff;
}

.hidden{display:none;}

/* FLOATING MENU BAR (HOME STYLE) */
.menu-bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:450px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(25px);
border-radius:35px;
display:flex;
justify-content:space-around;
padding:14px 5px;
box-shadow:0 0 20px rgba(0,245,255,.3);
}

.menu-bar a{
color:#888;
font-size:22px;
flex:1;
text-align:center;
text-decoration:none;
transition:.3s;
}

.menu-bar a.active{
color:#00f5ff;
transform:translateY(-6px);
}

</style>
</head>

<body>

<header>
<h3>My Profile</h3>
</header>

<div class="container">

<div class="card">
<div class="title">Email</div>
<div class="value" id="userEmail"></div>
</div>

<div class="card">
<div class="title">Username</div>
<div class="value" id="username"></div>
</div>

<div class="card">
<div class="title">Balance</div>
<div class="value">₵ <span id="balance">0.00</span></div>
</div>

<div class="card">
<div class="title">Total Purchases</div>
<div class="value" id="totalBuys">0</div>
</div>

<div class="card">
<button id="adminBtn" class="admin hidden">
Open Admin Dashboard
</button>

<button id="logoutBtn" class="logout">
Logout
</button>
</div>

</div>

<!-- SAME MENU BAR AS HOME -->
<div class="menu-bar">
<a href="home.html"><i class="fa-solid fa-house"></i></a>
<a href="stream.html"><i class="fa-solid fa-video"></i></a>
<a href="data.html"><i class="fa-solid fa-sim-card"></i></a>
<a href="chat.html"><i class="fa-solid fa-comments"></i></a>
<a href="profile.html" class="active"><i class="fa-solid fa-user"></i></a>
</div>
  <a href="privacy.html">Privacy and Policy</a>
  <a href="terms.html">Terms and Conditions</a>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import{
getAuth,onAuthStateChanged,signOut
}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import{
getDatabase,ref,onValue,set,update,onDisconnect
}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

/* FIREBASE */
const firebaseConfig={
apiKey:"AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain:"qwen-911.firebaseapp.com",
databaseURL:"https://qwen-911-default-rtdb.firebaseio.com",
projectId:"qwen-911"
};

const ADMIN_EMAIL="kwamemarfo916@gmail.com";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

/* ================= AUTH ================= */

onAuthStateChanged(auth,user=>{

if(!user){
location.href="index.html";
return;
}

/* USER INFO */
userEmail.textContent=user.email;
username.textContent=user.email.split("@")[0];

const userPath="users/"+user.uid;
const userRef=ref(db,userPath);

/* ===== AUTO CREATE USER RECORD ===== */
set(ref(db,userPath+"/meta"),{
lastLogin:Date.now()
});

/* ===== ONLINE STATUS ===== */
const onlineRef=ref(db,"online/"+user.uid);
set(onlineRef,{
email:user.email,
time:Date.now()
});

onDisconnect(onlineRef).remove();

/* ===== REALTIME USER DATA ===== */
onValue(userRef,snap=>{

if(!snap.exists()){
/* create default user */
set(userRef,{
balance:0,
totalBuys:0,
createdAt:Date.now()
});
return;
}

const d=snap.val();

balance.textContent=
Number(d.balance||0).toFixed(2);

totalBuys.textContent=
d.totalBuys||0;

});

/* ===== ADMIN ACCESS ===== */
if(user.email===ADMIN_EMAIL){
adminBtn.classList.remove("hidden");
}

/* ===== ANALYTICS TRACK ===== */
if(window.trackEvent){
trackEvent("profile_open",{
email:user.email
});
}

});

/* ================= BUTTONS ================= */

adminBtn.onclick=()=>{
if(window.trackEvent){
trackEvent("admin_open_click");
}
location.href="admin.html";
};

logoutBtn.onclick=()=>{

if(auth.currentUser && window.trackEvent){
trackEvent("logout",{
email:auth.currentUser.email
});
}

signOut(auth).then(()=>{
location.href="index.html";
});
};

                                                      </script>

  <script type="module" src="analytics.js"></script>
</body>
  </html>
