<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QWEN-911 Profile</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Inter;
background:#070810;
color:#fff;
padding-bottom:120px;
}

header{
text-align:center;
padding:15px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(15px);
border-bottom:1px solid rgba(255,255,255,.06);
}

.container{
padding:15px;
display:flex;
flex-direction:column;
gap:14px;
}

.card{
background:rgba(255,255,255,.05);
border-radius:16px;
padding:14px;
border:1px solid rgba(255,255,255,.07);
}

.title{
font-size:13px;
opacity:.7;
margin-bottom:6px;
}

.value{
font-size:15px;
word-break:break-all;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:14px;
margin-top:8px;
font-weight:600;
cursor:pointer;
}

.primary{
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
}

.admin{
background:linear-gradient(135deg,#ffb300,#ff0066);
color:#000;
}

.logout{
background:#ff3b3b;
color:#fff;
}

.hidden{display:none;}

</style>
</head>

<body>

<header>
<h3>My Profile</h3>
</header>

<div class="container">

<div class="card">
<div class="title">User Email</div>
<div class="value" id="userEmail">Loading...</div>
</div>

<div class="card">
<div class="title">Username</div>
<div class="value" id="username"></div>
</div>

<div class="card">
<div class="title">Account Balance</div>
<div class="value">₵ <span id="balance">0.00</span></div>
</div>

<div class="card">
<div class="title">Total Purchases</div>
<div class="value" id="totalBuys">0</div>
</div>

<div class="card">
<button id="adminBtn" class="admin hidden">
Admin Dashboard
</button>

<button id="logoutBtn" class="logout">
Logout
</button>
</div>

</div>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import{
getAuth,onAuthStateChanged,signOut
}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import{
getDatabase,ref,onValue
}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain:"qwen-911.firebaseapp.com",
databaseURL:"https://qwen-911-default-rtdb.firebaseio.com",
projectId:"qwen-911"
};

const ADMIN_EMAIL="kwamemarfo916@gmail.com";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

onAuthStateChanged(auth,user=>{

if(!user)location.href="index.html";

userEmail.textContent=user.email;
username.textContent=user.email.split("@")[0];

const userRef=ref(db,"users/"+user.uid);

onValue(userRef,snap=>{
if(!snap.exists())return;

const data=snap.val();

balance.textContent=(data.balance||0).toFixed(2);
totalBuys.textContent=data.totalBuys||0;
});

/* ADMIN ACCESS */
if(user.email===ADMIN_EMAIL){
adminBtn.classList.remove("hidden");
}

});

/* ADMIN BUTTON */
adminBtn.onclick=()=>{
location.href="admin.html";
};

/* LOGOUT */
logoutBtn.onclick=()=>{
signOut(auth).then(()=>{
location.href="index.html";
});
};

</script>
</body>
</html>
