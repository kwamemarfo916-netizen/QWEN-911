<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWEN-911 Global Chat</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Inter,system-ui;
background:#06070d;
color:#fff;
display:flex;
flex-direction:column;
height:100vh;
overflow:hidden;
padding-bottom:120px;
}

header{
padding:14px;
text-align:center;
background:rgba(15,15,25,.85);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.06);
}

.top-menu{
display:flex;
justify-content:center;
gap:10px;
margin-top:8px;
}

.top-menu button{
border:none;
padding:6px 14px;
border-radius:20px;
background:#111;
color:#fff;
cursor:pointer;
}

#messages{
flex:1;
overflow-y:auto;
padding:14px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
max-width:85%;
display:flex;
flex-direction:column;
}

.sent{align-self:flex-end;}
.received{align-self:flex-start;}

.bubble{
padding:10px 14px;
border-radius:18px;
font-size:14px;
background:rgba(255,255,255,.05);
}

.sent .bubble{
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
}

.time{
font-size:10px;
opacity:.6;
text-align:right;
margin-top:4px;
}

.username{
font-size:11px;
opacity:.8;
margin-bottom:2px;
}

img,video{
width:100%;
border-radius:10px;
margin-top:6px;
}

.input-area{
position:fixed;
bottom:90px;
width:100%;
display:flex;
gap:6px;
padding:10px;
background:rgba(18,18,28,.92);
}

#messageInput{
flex:1;
padding:10px;
border:none;
border-radius:25px;
background:rgba(255,255,255,.05);
color:#fff;
}

.btn{
width:40px;
height:40px;
border:none;
border-radius:50%;
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
cursor:pointer;
}

.menu-bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:450px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(25px);
border-radius:35px;
display:flex;
justify-content:space-around;
padding:14px 5px;
}

.menu-bar a{
color:#888;
font-size:22px;
text-decoration:none;
}

</style>
</head>

<body>

<header>

CHAT LEVEL MAX

<div class="top-menu">
<button id="globalBtn">Group Chat</button>
<button id="privateBtn">Private Chat</button>
<button id="campaignBtn">Campaign</button>
</div>

</header>

<div id="messages"></div>

<div class="input-area">
<input type="file" id="imgInput" hidden accept="image/*">
<input type="file" id="videoInput" hidden accept="video/*">

<button class="btn" id="imgBtn">
<i class="fa fa-image"></i>
</button>

<button class="btn" id="videoBtn">
<i class="fa fa-video"></i>
</button>

<button class="btn" id="sendBtn">
<i class="fa fa-paper-plane"></i>
</button>

<input id="messageInput" placeholder="Type message...">
</div>

<div class="menu-bar">
<a href="home.html"><i class="fa-solid fa-house"></i></a>
<a href="stream.html"><i class="fa-solid fa-video"></i></a>
<a href="data.html"><i class="fa-solid fa-sim-card"></i></a>
<a href="chat.html"><i class="fa-solid fa-comments"></i></a>
<a href="profile.html"><i class="fa-solid fa-user"></i></a>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import {
getDatabase,
ref,
push,
onChildAdded
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

import {
getStorage,
ref as sRef,
uploadBytes,
getDownloadURL
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";


const firebaseConfig={
apiKey:"AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain:"qwen-911.firebaseapp.com",
databaseURL:"https://qwen-911-default-rtdb.firebaseio.com",
projectId:"qwen-911",
storageBucket:"qwen-911.appspot.com"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const storage=getStorage(app);

let username="";
let chatMode="global";

onAuthStateChanged(auth,user=>{
if(!user) location.href="login.html";

username=user.email.split("@")[0];

loadMessages();

});


function loadMessages(){

messages.innerHTML="";

onChildAdded(
ref(db,"messages/"+chatMode),
snap=>{

const m=snap.val();

const div=document.createElement("div");

div.className="msg "+(m.user===username?"sent":"received");

div.innerHTML=`

<div class="username">${m.user}</div>

<div class="bubble">

${m.type==="image" ? `<img src="${m.url}">` : ""}

${m.type==="video" ? `<video controls src="${m.url}"></video>` : ""}

${m.text ? m.text : ""}

<div class="time">

${new Date(m.time).toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
})}

</div>

</div>
`;

messages.appendChild(div);

messages.scrollTop=messages.scrollHeight;

});
}



sendBtn.onclick=()=>{

const text=messageInput.value.trim();

if(!text) return;

push(ref(db,"messages/"+chatMode),{

type:"text",
text,
user:username,
time:Date.now()

});

messageInput.value="";

};



imgBtn.onclick=()=>imgInput.click();

imgInput.onchange=async e=>{

const file=e.target.files[0];

const fileRef=sRef(
storage,
"chatMedia/images/"+Date.now()+".jpg"
);

await uploadBytes(fileRef,file);

const url=await getDownloadURL(fileRef);

push(ref(db,"messages/"+chatMode),{

type:"image",
url,
user:username,
time:Date.now()

});

};



videoBtn.onclick=()=>videoInput.click();

videoInput.onchange=async e=>{

const file=e.target.files[0];

const fileRef=sRef(
storage,
"chatMedia/videos/"+Date.now()+".mp4"
);

await uploadBytes(fileRef,file);

const url=await getDownloadURL(fileRef);

push(ref(db,"messages/"+chatMode),{

type:"video",
url,
user:username,
time:Date.now()

});

};



globalBtn.onclick=()=>{
chatMode="global";
loadMessages();
}

privateBtn.onclick=()=>{
chatMode="private";
loadMessages();
}

campaignBtn.onclick=()=>{
chatMode="campaign";
loadMessages();
}

</script>

<script type="module" src="analytics.js"></script>

</body>
 </html>
