<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWEN-911 Live Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* CHAT AREA */
.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:15px;
  padding-bottom:160px;
}

.message{
  max-width:75%;
  padding:10px 14px;
  margin-bottom:10px;
  border-radius:18px;
  position:relative;
  cursor:pointer;
  word-wrap:break-word;
  animation:fadeIn .2s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(5px);}
  to{opacity:1;transform:translateY(0);}
}

.me{
  background:#00c6ff;
  align-self:flex-end;
  margin-left:auto;
  border-bottom-right-radius:5px;
}

.other{
  background:#1e2a38;
  align-self:flex-start;
  border-bottom-left-radius:5px;
}

.username{
  font-size:12px;
  opacity:.7;
  margin-bottom:3px;
}

.tick{
  font-size:12px;
  position:absolute;
  bottom:5px;
  right:10px;
}

/* IMAGE */
.message img{
  max-width:100%;
  border-radius:10px;
  margin-top:5px;
}

/* TYPING */
.typing{
  font-size:13px;
  opacity:.6;
  margin-left:15px;
  margin-bottom:5px;
}

/* INPUT */
.chat-input{
  position:fixed;
  bottom:90px;
  left:0;
  width:100%;
  display:flex;
  padding:10px;
  background:#111;
  z-index:999;
}

.chat-input input[type="text"]{
  flex:1;
  padding:12px;
  border-radius:25px;
  border:none;
  outline:none;
}

.chat-input button{
  margin-left:8px;
  border:none;
  padding:12px 15px;
  border-radius:50%;
  background:#00c6ff;
  color:white;
  cursor:pointer;
}

/* FLOATING TELEGRAM STYLE MENU */
.floating-menu{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  width:85%;
  max-width:420px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding:12px 0;
  background:rgba(25,35,50,0.95);
  backdrop-filter:blur(10px);
  border-radius:30px;
  box-shadow:0 8px 20px rgba(0,0,0,0.4);
  z-index:1000;
}

.floating-menu i{
  font-size:22px;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="chat-messages" id="chat"></div>
<div class="typing" id="typing"></div>

<div class="chat-input">
  <input type="text" id="messageInput" placeholder="Type message...">
  <input type="file" id="imageInput" hidden>
  <button onclick="document.getElementById('imageInput').click()">
    <i class="fa fa-image"></i>
  </button>
  <button onclick="sendMessage()">
    <i class="fa fa-paper-plane"></i>
  </button>
</div>

<div class="floating-menu">
  <i class="fa fa-home" onclick="location.href='home.html'"></i>
  <i class="fa fa-tv" onclick="location.href='stream.html'"></i>
  <i class="fa fa-signal" onclick="location.href='data.html'"></i>
  <i class="fa fa-user" onclick="location.href='profile.html'"></i>
  <i class="fa fa-comments"></i>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getDatabase,ref,push,onChildAdded,set,update } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain: "qwen-911.firebaseapp.com",
databaseURL: "https://qwen-911-default-rtdb.firebaseio.com",
projectId: "qwen-911",
storageBucket: "qwen-911.firebasestorage.app",
messagingSenderId: "518019892837",
appId: "1:518019892837:web:9972dd63d8dca7936ea88c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser="";
let replyingTo=null;

onAuthStateChanged(auth,(user)=>{
  if(user){
    currentUser = user.email.replace("@gmail.com","");
  }
});

window.sendMessage=function(){
  const input=document.getElementById("messageInput");
  const text=input.value.trim();
  if(text==="") return;

  push(ref(db,"messages"),{
    user:currentUser,
    text:text,
    reply:replyingTo,
    timestamp:Date.now(),
    delivered:true
  });

  input.value="";
  replyingTo=null;
}

/* IMAGE UPLOAD WITH AUTO COMPRESS */
document.getElementById("imageInput").addEventListener("change",function(e){
  const file=e.target.files[0];
  const reader=new FileReader();
  reader.onload=function(event){
    const img=new Image();
    img.src=event.target.result;
    img.onload=function(){
      const canvas=document.createElement("canvas");
      const ctx=canvas.getContext("2d");
      const maxWidth=400;
      const scale=maxWidth/img.width;
      canvas.width=maxWidth;
      canvas.height=img.height*scale;
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const compressed=canvas.toDataURL("image/jpeg",0.6);

      push(ref(db,"messages"),{
        user:currentUser,
        image:compressed,
        timestamp:Date.now(),
        delivered:true
      });
    }
  };
  reader.readAsDataURL(file);
});

/* DISPLAY */
onChildAdded(ref(db,"messages"),(snapshot)=>{
  const data=snapshot.val();
  const chat=document.getElementById("chat");

  const msg=document.createElement("div");
  msg.classList.add("message");
  msg.classList.add(data.user===currentUser?"me":"other");

  msg.innerHTML=`
    <div class="username">${data.user}</div>
    ${data.reply?`<div style="font-size:12px;opacity:.6">Reply: ${data.reply}</div>`:""}
    ${data.text?data.text:""}
    ${data.image?`<img src="${data.image}">`:""}
    ${data.user===currentUser?`<div class="tick">✓✓</div>`:""}
  `;

  msg.onclick=()=>{
    replyingTo=data.text || "Image";
    document.getElementById("messageInput").focus();
  };

  chat.appendChild(msg);
  chat.scrollTop=chat.scrollHeight;
});
</script>

</body>
  </html>
