<!DOCTYPE html>
<html>
<head>
<title>QWEN-911 Live Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0e1621;
color:white;
}

/* CHAT WRAPPER */
.chat-wrapper{
width:95%;
max-width:900px;
margin:20px auto;
background:rgba(23,33,43,0.6);
backdrop-filter:blur(15px);
border-radius:20px;
box-shadow:0 0 25px rgba(0,255,200,0.1);
display:flex;
flex-direction:column;
height:75vh;
overflow:hidden;
padding-bottom:80px; /* space for floating menu */
}

.chat-header{
padding:15px;
background:linear-gradient(90deg,#0084ff,aquamarine);
font-weight:bold;
text-align:center;
}

.chat-messages{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:8px;
}

.message{
max-width:70%;
padding:12px 14px;
border-radius:18px;
font-size:14px;
animation:fadeIn .2s ease;
position:relative;
}

.sent{
align-self:flex-end;
background:linear-gradient(135deg,#0084ff,#00c6ff);
border-bottom-right-radius:5px;
}

.received{
align-self:flex-start;
background:#1f2a36;
border-bottom-left-radius:5px;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(5px);}
to{opacity:1;transform:translateY(0);}
}

.reply-box{
font-size:12px;
opacity:.7;
border-left:3px solid aquamarine;
padding-left:6px;
margin-bottom:5px;
}

.reply-preview{
background:#1f2a36;
padding:8px 12px;
font-size:12px;
display:none;
border-left:4px solid aquamarine;
}

.chat-input-area{
display:flex;
padding:10px;
background:#17212b;
gap:8px;
position:fixed;
bottom:70px; /* above floating menu */
left:50%;
transform:translateX(-50%);
width:95%;
max-width:900px;
border-radius:20px;
box-shadow:0 0 15px rgba(0,255,200,0.3);
z-index:900;
}

#messageInput{
flex:1;
padding:10px 15px;
border-radius:20px;
border:none;
outline:none;
}

.chat-input-area button{
padding:10px 15px;
border:none;
border-radius:20px;
background:aquamarine;
cursor:pointer;
font-weight:bold;
}

.message img{
max-width:100%;
border-radius:12px;
margin-top:6px;
}

.tick{
font-size:12px;
opacity:.6;
text-align:right;
margin-top:3px;
}

#typingIndicator{
padding:8px 15px;
font-size:13px;
opacity:.7;
}

/* ===== FLOATING EMOJI MENU ===== */
.floating-menu{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
display:flex;
justify-content:space-around;
width:300px;
background:rgba(23,33,43,0.9);
padding:10px;
border-radius:50px;
box-shadow:0 0 20px rgba(0,255,200,0.4);
z-index:1000;
}

.floating-menu button{
font-size:24px;
background:none;
border:none;
cursor:pointer;
color:white;
}
</style>
</head>

<body>

<div class="chat-wrapper">
  <div class="chat-header">
    💬 Global Live Chat
  </div>

  <div id="messages" class="chat-messages"></div>
  <div id="typingIndicator"></div>
  <div id="replyPreview" class="reply-preview"></div>
</div>

<!-- Chat Input -->
<div class="chat-input-area">
<input type="file" id="imageInput" hidden>
<button onclick="document.getElementById('imageInput').click()">📎</button>
<input id="messageInput" placeholder="Type a message...">
<button onclick="sendMessage()">Send</button>
</div>

<!-- Floating Emoji Menu -->
<div class="floating-menu">
<button onclick="window.location.href='index.html'">🏠</button>
<button onclick="window.location.href='stream.html'">📺</button>
<button onclick="window.location.href='data.html'">📶</button>
<button onclick="window.location.href='profile.html'">👤</button>
<button onclick="document.getElementById('messageInput').focus()">💬</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, update, set, remove, onValue } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
apiKey: "AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain: "qwen-911.firebaseapp.com",
databaseURL: "https://qwen-911-default-rtdb.firebaseio.com",
projectId: "qwen-911",
storageBucket: "qwen-911.firebasestorage.app",
messagingSenderId: "518019892837",
appId: "1:518019892837:web:9972dd63d8dca7936ea88c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth();
const storage = getStorage(app);

let currentUser=null;
let replyTo=null;
const typingRef = ref(db,"typing/global");

onAuthStateChanged(auth,user=>{
if(user){
currentUser=user;
loadMessages();
setupTypingListener();
}else{
window.location.href="login.html";
}
});

function loadMessages(){
const chatRef = ref(db,"chats/global");

onChildAdded(chatRef, snap=>{
const msg=snap.val();
const key=snap.key;

if(msg.senderId !== currentUser.uid && msg.status==="sent"){
update(ref(db,"chats/global/"+key),{status:"delivered"});
}

displayMessage(msg);
});
}

function displayMessage(msg){
const div=document.createElement("div");
div.classList.add("message");
div.classList.add(msg.senderId===currentUser.uid ? "sent":"received");

if(msg.replyText){
const replyDiv=document.createElement("div");
replyDiv.classList.add("reply-box");
replyDiv.textContent=msg.replyText;
div.appendChild(replyDiv);
}

if(msg.text) div.appendChild(document.createTextNode(msg.text));
if(msg.imageUrl){
const img=document.createElement("img");
img.src=msg.imageUrl;
div.appendChild(img);
}

if(msg.senderId===currentUser.uid){
const tick=document.createElement("div");
tick.classList.add("tick");
tick.textContent=msg.status==="delivered" ? "✓✓" : "✓";
div.appendChild(tick);
}

div.onclick=()=>{
replyTo=msg.text || "Image";
document.getElementById("replyPreview").style.display="block";
document.getElementById("replyPreview").textContent="Replying to: "+replyTo;
};

document.getElementById("messages").appendChild(div);
div.scrollIntoView();
}

async function compressImage(file){
return new Promise((resolve)=>{
const reader=new FileReader();
reader.readAsDataURL(file);
reader.onload=(e)=>{
const img=new Image();
img.src=e.target.result;
img.onload=()=>{
const canvas=document.createElement("canvas");
const maxWidth=800;
const scale=maxWidth/img.width;
canvas.width=maxWidth;
canvas.height=img.height*scale;
const ctx=canvas.getContext("2d");
ctx.drawImage(img,0,0,canvas.width,canvas.height);
canvas.toBlob(blob=>resolve(blob),"image/jpeg",0.7);
};
};
});
}

// Typing Indicator
function setupTypingListener(){
document.getElementById("messageInput").addEventListener("input",async()=>{
const username=currentUser.email.replace("@gmail.com","");
await set(ref(db,"typing/global/"+currentUser.uid),{name:username});

clearTimeout(window.typingTimeout);
window.typingTimeout=setTimeout(()=>{
remove(ref(db,"typing/global/"+currentUser.uid));
},1500);
});

onValue(typingRef,(snapshot)=>{
const data=snapshot.val();
const indicator=document.getElementById("typingIndicator");
if(!data){indicator.textContent=""; return;}

const typers=Object.values(data)
.filter(t=>t.name!==currentUser.email.replace("@gmail.com",""))
.map(t=>t.name);

indicator.textContent=typers.length>0 ? typers.join(", ")+" is typing..." : "";
});
}

window.sendMessage=async function(){
const text=document.getElementById("messageInput").value;
const file=document.getElementById("imageInput").files[0];
if(!text && !file) return;

let imageUrl=null;
if(file){
const compressed=await compressImage(file);
const storageRef=sRef(storage,"chatImages/"+Date.now());
await uploadBytes(storageRef,compressed);
imageUrl=await getDownloadURL(storageRef);
}

const username=currentUser.email.replace("@gmail.com","");
await push(ref(db,"chats/global"),{
senderId:currentUser.uid,
senderName:username,
text:text || "",
imageUrl:imageUrl || "",
replyText:replyTo || "",
status:"sent",
timestamp:Date.now()
});

document.getElementById("messageInput").value="";
document.getElementById("imageInput").value="";
document.getElementById("replyPreview").style.display="none";
replyTo=null;

// remove typing after send
remove(ref(db,"typing/global/"+currentUser.uid));
};
</script>

</body>
  </html>
