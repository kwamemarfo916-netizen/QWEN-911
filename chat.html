<!DOCTYPE html>
<html>
<head>
<title>QWEN-911 Live Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0e1621;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

/* HEADER */
.chat-header{
background:#17212b;
padding:15px;
display:flex;
align-items:center;
gap:8px;
font-weight:bold;
}

.live-dot{
width:10px;
height:10px;
background:red;
border-radius:50%;
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:.3;}
100%{opacity:1;}
}

#onlineCount{
margin-left:auto;
font-size:13px;
color:aquamarine;
}

/* MESSAGE AREA */
#messages{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.message{
max-width:75%;
padding:10px;
border-radius:15px;
position:relative;
word-wrap:break-word;
cursor:pointer;
}

.left{
background:#1f2a36;
align-self:flex-start;
}

.right{
background:aquamarine;
color:black;
align-self:flex-end;
}

.username{
font-size:12px;
font-weight:bold;
margin-bottom:3px;
}

.timestamp{
font-size:10px;
opacity:.7;
margin-top:5px;
}

.reply-preview{
background:#2a3a4a;
padding:5px 8px;
border-left:3px solid aquamarine;
font-size:11px;
margin-bottom:5px;
border-radius:5px;
}

img.chat-image{
max-width:100%;
border-radius:10px;
margin-top:5px;
}

/* INPUT AREA */
.input-container{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#17212b;
padding:8px;
display:flex;
gap:6px;
align-items:center;
}

.input-container input[type=text]{
flex:1;
padding:10px;
border-radius:20px;
border:none;
}

.input-container button{
background:aquamarine;
border:none;
padding:8px 12px;
border-radius:50%;
cursor:pointer;
}

input[type=file]{
display:none;
}
</style>
</head>
<body>

<div class="chat-header">
LIVE CHAT
<div class="live-dot"></div>
<span id="onlineCount">0 online</span>
</div>

<div id="messages"></div>

<div class="input-container">
<label for="imageUpload">📎</label>
<input type="file" id="imageUpload" accept="image/*">
<input id="input" type="text" placeholder="Type message...">
<button id="sendBtn">➤</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
getDatabase, ref, push, onChildAdded,
set, onDisconnect, onValue, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import {
getStorage, ref as sRef, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

/* YOUR REAL CONFIG */
const firebaseConfig = {
apiKey: "AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain: "qwen-911.firebaseapp.com",
databaseURL: "https://qwen-911-default-rtdb.firebaseio.com",
projectId: "qwen-911",
storageBucket: "qwen-911.firebasestorage.app",
messagingSenderId: "518019892837",
appId: "1:518019892837:web:9972dd63d8dca7936ea88c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);

const messagesDiv = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const imageUpload = document.getElementById("imageUpload");
const onlineCount = document.getElementById("onlineCount");

/* USERNAME FROM EMAIL */
let currentUserEmail = localStorage.getItem("userEmail") || "user@example.com";
let username = currentUserEmail.replace("@example.com","");
let replyTo = null;

/* ONLINE USERS SYSTEM */
const userId = Date.now().toString();
const userRef = ref(db,"onlineUsers/"+userId);
set(userRef,true);
onDisconnect(userRef).remove();

onValue(ref(db,"onlineUsers"),snap=>{
const users = snap.val();
onlineCount.textContent = users ? Object.keys(users).length+" online":"0 online";
});

/* SEND MESSAGE FUNCTION */
function sendMessage(text,imageUrl){
push(ref(db,"messages"),{
username,
text:text||"",
imageUrl:imageUrl||"",
replyTo:replyTo||"",
timestamp:serverTimestamp()
});
replyTo=null;
input.placeholder="Type message...";
input.value="";
}

/* TEXT SEND */
sendBtn.onclick=()=>{
if(input.value.trim()!==""){
sendMessage(input.value,null);
}
};

input.addEventListener("keypress",e=>{
if(e.key==="Enter") sendBtn.onclick();
});

/* IMAGE UPLOAD */
imageUpload.addEventListener("change",async e=>{
const file = e.target.files[0];
if(!file) return;

const imageRef = sRef(storage,"chatImages/"+Date.now());
await uploadBytes(imageRef,file);
const url = await getDownloadURL(imageRef);

sendMessage(null,url);
});

/* DISPLAY MESSAGES */
onChildAdded(ref(db,"messages"),snap=>{
const data = snap.val();

const msgDiv = document.createElement("div");
msgDiv.classList.add("message");
msgDiv.classList.add(data.username===username?"right":"left");

let time="";
if(data.timestamp){
const date=new Date(data.timestamp);
time=date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

msgDiv.innerHTML=`
<div class="username">${data.username}</div>
${data.replyTo?`<div class="reply-preview">${data.replyTo}</div>`:""}
${data.text?`<div>${data.text}</div>`:""}
${data.imageUrl?`<img src="${data.imageUrl}" class="chat-image">`:""}
<div class="timestamp">${time}</div>
`;

/* WHATSAPP STYLE REPLY */
msgDiv.onclick=()=>{
replyTo = data.text || "Image";
input.placeholder="Replying to message...";
};

messagesDiv.appendChild(msgDiv);
messagesDiv.scrollTop=messagesDiv.scrollHeight;
});
</script>

</body>
</html>
