<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWEN-911 Global Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body{margin:0;font-family:Inter,sans-serif;background:#0a0a12;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden;padding-bottom:120px}
header{padding:12px;text-align:center;background:rgba(20,20,30,.9);backdrop-filter:blur(15px);border-bottom:1px solid rgba(255,255,255,.05)}
.online{font-size:12px;color:#00f5ff}
#search{width:90%;margin:8px auto;padding:6px 12px;border:none;border-radius:20px;background:rgba(255,255,255,.05);color:#fff;outline:none}
#messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;display:flex;flex-direction:column;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.user-label{font-size:10px;color:#aaa;margin-bottom:2px}
.bubble{padding:8px 12px;border-radius:16px;font-size:14px;position:relative}
.sent{align-self:flex-end}
.sent .bubble{background:linear-gradient(135deg,#00f5ff,#a855f7);color:#000}
.received{align-self:flex-start}
.received .bubble{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.time{font-size:9px;opacity:.7;margin-top:3px;text-align:right}
.ticks{margin-left:4px;color:#00f5ff}
.react{font-size:11px;margin-top:3px}
.reply-preview{font-size:11px;background:rgba(255,255,255,.05);padding:4px 8px;border-left:3px solid #00f5ff;margin-bottom:4px;border-radius:8px}
.input-area{position:fixed;bottom:90px;width:100%;display:flex;gap:6px;padding:8px;background:rgba(20,20,30,.95);backdrop-filter:blur(15px)}
#messageInput{flex:1;padding:8px;border:none;border-radius:20px;background:rgba(255,255,255,.05);color:#fff;outline:none}
.btn{width:38px;height:38px;border:none;border-radius:50%;background:linear-gradient(135deg,#00f5ff,#a855f7);color:#000;cursor:pointer}
.menu-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:92%;max-width:450px;background:rgba(20,20,30,.9);backdrop-filter:blur(25px);border-radius:35px;display:flex;justify-content:space-around;padding:14px 5px;box-shadow:0 0 20px rgba(0,245,255,.3)}
.menu-bar a{color:#888;font-size:22px;flex:1;text-align:center;text-decoration:none}
.menu-bar a.active{color:#00f5ff;transform:translateY(-6px)}
#typing{font-size:12px;color:#aaa;padding-left:15px}
</style>
</head>
<body>

<header>
Global Chat Room
<div class="online">Online Users: <span id="onlineCount">0</span></div>
</header>

<input id="search" placeholder="Search messages...">
<div id="messages"></div>
<div id="typing"></div>

<div class="input-area">
<input type="file" id="imgInput" hidden>
<button class="btn" id="imgBtn"><i class="fa fa-image"></i></button>
<button class="btn" id="sendBtn"><i class="fa fa-paper-plane"></i></button>
<input type="text" id="messageInput" placeholder="Type message...">
</div>

<div class="menu-bar">
<a href="home.html"><i class="fa-solid fa-house"></i></a>
<a href="stream.html"><i class="fa-solid fa-video"></i></a>
<a href="data.html"><i class="fa-solid fa-sim-card"></i></a>
<a href="chat.html" class="active"><i class="fa-solid fa-comments"></i></a>
<a href="profile.html"><i class="fa-solid fa-user"></i></a>
</div>

<script type="module">

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import{
getDatabase,ref,push,onChildAdded,set,onDisconnect,
remove,update,get,onValue
}from"https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

/* FIREBASE */
const firebaseConfig={
apiKey:"AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain:"qwen-911.firebaseapp.com",
databaseURL:"https://qwen-911-default-rtdb.firebaseio.com",
projectId:"qwen-911"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

const box=messages;
let replyTo=null;
let lastSender=null;
let typingTimeout;

/* AUTH */
onAuthStateChanged(auth,user=>{
if(!user)return location.href="login.html";

const username=user.email.split("@")[0];

/* ================= ONLINE ================= */

const onlineRef=ref(db,"online/"+username);
set(onlineRef,true);
onDisconnect(onlineRef).remove();

onValue(ref(db,"online"),snap=>{
onlineCount.innerText=snap.exists()?Object.keys(snap.val()).length:0;
});

/* ================= SEND ================= */

function send(){
let text=messageInput.value.trim();
if(!text)return;

push(ref(db,"messages"),{
text,
user:username,
time:Date.now(),
reply:replyTo,
reactions:{},
seen:false
});

messageInput.value="";
replyTo=null;
removeReplyPreview();
}

sendBtn.onclick=send;

messageInput.addEventListener("keydown",e=>{
if(e.key==="Enter")send();
});

/* ================= TYPING ================= */

messageInput.oninput=()=>{
set(ref(db,"typing/"+username),true);

clearTimeout(typingTimeout);
typingTimeout=setTimeout(()=>{
remove(ref(db,"typing/"+username));
},1200);
};

onValue(ref(db,"typing"),snap=>{
if(!snap.exists())return typing.innerText="";
let users=Object.keys(snap.val()).filter(u=>u!==username);
typing.innerText=users.length?users.join(", ")+" typing...":"";
});

/* ================= IMAGE ================= */

imgBtn.onclick=()=>imgInput.click();

imgInput.onchange=e=>{
const file=e.target.files[0];
if(!file)return;

const img=new Image();
img.src=URL.createObjectURL(file);

img.onload=()=>{
const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");

const scale=600/img.width;
canvas.width=600;
canvas.height=img.height*scale;

ctx.drawImage(img,0,0,canvas.width,canvas.height);

const data=canvas.toDataURL("image/jpeg",0.7);

push(ref(db,"messages"),{
image:data,
user:username,
time:Date.now(),
reply:null,
reactions:{},
seen:false
});
};
};

/* ================= REPLY PREVIEW ================= */

function showReply(text){
removeReplyPreview();

const bar=document.createElement("div");
bar.id="replyBar";
bar.className="reply-preview";
bar.innerHTML=`Replying: ${text} ❌`;

bar.onclick=()=>{
replyTo=null;
bar.remove();
};

document.querySelector(".input-area").prepend(bar);
}

function removeReplyPreview(){
const old=document.getElementById("replyBar");
if(old)old.remove();
}

/* ================= LOAD MESSAGES ================= */

onChildAdded(ref(db,"messages"),snap=>{

const m=snap.val();
const key=snap.key;

const div=document.createElement("div");
div.className="msg "+(m.user===username?"sent":"received");

/* GROUP USER LABEL */
if(lastSender!==m.user){
const label=document.createElement("div");
label.className="user-label";
label.innerText=m.user;
div.appendChild(label);
lastSender=m.user;
}

const bubble=document.createElement("div");
bubble.className="bubble";

let replyHTML="";
if(m.reply){
replyHTML=`<div class="reply-preview">${m.reply}</div>`;
}

bubble.innerHTML=`
${replyHTML}
${m.text||""}
${m.image?'<img src="'+m.image+'" style="width:100%;border-radius:8px;margin-top:5px">':""}
<div class="react">${m.reactions?Object.values(m.reactions).join(" "):""}</div>
<div class="time">
${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
${m.user===username?'<span class="ticks">'+(m.seen?'✓✓':'✓')+'</span>':""}
</div>
`;

/* CLICK = REPLY */
bubble.onclick=()=>{
replyTo=m.text||"Image";
showReply(replyTo);
};

/* DOUBLE CLICK QUICK ❤️ */
bubble.ondblclick=()=>{
update(ref(db,"messages/"+key+"/reactions/"+username),"❤️");
};

/* LONG PRESS MENU */
bubble.oncontextmenu=e=>{
e.preventDefault();

let action=prompt("1.React  2.Edit  3.Delete");

if(action==1){
let emoji=prompt("Emoji 👍🔥😂❤️");
if(emoji)update(ref(db,"messages/"+key+"/reactions/"+username),emoji);
}

if(action==2 && m.user===username){
let edit=prompt("Edit message",m.text);
if(edit)update(ref(db,"messages/"+key),{text:edit});
}

if(action==3 && m.user===username){
remove(ref(db,"messages/"+key));
}
};

div.appendChild(bubble);
box.appendChild(div);

/* SMOOTH SCROLL */
requestAnimationFrame(()=>{
box.scrollTop=box.scrollHeight;
});

/* AUTO SEEN */
if(m.user!==username){
update(ref(db,"messages/"+key),{seen:true});
}

});

/* ================= SEARCH ================= */

search.oninput=()=>{
let val=search.value.toLowerCase();

document.querySelectorAll(".msg").forEach(m=>{
m.style.display=
m.innerText.toLowerCase().includes(val)?"flex":"none";
});
};

});
  </script>

</body>
</html>
