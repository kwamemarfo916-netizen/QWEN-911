<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWEN-911 Global Chat — CHAT LEVEL MAX</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* ================= CORE ================= */

body{
margin:0;
font-family:Inter,system-ui;
background:#06070d;
color:#fff;
display:flex;
flex-direction:column;
height:100vh;
overflow:hidden;
padding-bottom:120px;
}

/* ===== HEADER ===== */

header{
padding:14px;
text-align:center;
background:rgba(15,15,25,.85);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.06);
font-size:15px;
letter-spacing:.6px;
}

.online{
font-size:11px;
color:#00f5ff;
opacity:.85;
}

/* ===== SEARCH ===== */

#search{
width:90%;
margin:10px auto;
padding:8px 14px;
border:none;
border-radius:25px;
background:rgba(255,255,255,.05);
color:#fff;
outline:none;
}

/* ===== CHAT AREA ===== */

#messages{
flex:1;
overflow-y:auto;
padding:14px;
display:flex;
flex-direction:column;
gap:10px;
scroll-behavior:smooth;
}

.msg{
max-width:85%;
display:flex;
flex-direction:column;
animation:fade .25s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(8px)}
to{opacity:1}
}

/* username label */
.user-label{
font-size:9px;
color:#8b8b9f;
margin-bottom:3px;
letter-spacing:.5px;
}

/* bubbles */
.bubble{
padding:10px 14px;
border-radius:18px;
font-size:14px;
position:relative;
line-height:1.35;
box-shadow:0 0 12px rgba(0,0,0,.3);
}

.sent{align-self:flex-end;}

.sent .bubble{
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
}

.received{align-self:flex-start;}

.received .bubble{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.07);
}

/* reply preview */
.reply-preview{
font-size:10px;
background:rgba(255,255,255,.06);
padding:5px 8px;
border-left:3px solid #00f5ff;
margin-bottom:6px;
border-radius:8px;
opacity:.9;
}

/* reactions */
.react{
font-size:12px;
margin-top:4px;
opacity:.9;
}

/* time */
.time{
font-size:9px;
opacity:.65;
margin-top:3px;
text-align:right;
}

.ticks{color:#00f5ff;margin-left:4px}

/* ===== INPUT ===== */

.input-area{
position:fixed;
bottom:90px;
width:100%;
display:flex;
gap:6px;
padding:10px;
background:rgba(18,18,28,.92);
backdrop-filter:blur(18px);
}

#messageInput{
flex:1;
padding:10px;
border:none;
border-radius:25px;
background:rgba(255,255,255,.05);
color:#fff;
outline:none;
}

.btn{
width:40px;
height:40px;
border:none;
border-radius:50%;
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
cursor:pointer;
transition:.2s;
}

.btn:hover{transform:scale(1.08)}

#typing{
font-size:11px;
color:#aaa;
padding-left:15px;
height:16px;
}

/* ===== MENU BAR (UNCHANGED AS REQUESTED) ===== */

.menu-bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:450px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(25px);
border-radius:35px;
display:flex;
justify-content:space-around;
padding:14px 5px;
box-shadow:0 0 20px rgba(0,245,255,.3)
}

.menu-bar a{
color:#888;
font-size:22px;
flex:1;
text-align:center;
text-decoration:none
}

.menu-bar a.active{
color:#00f5ff;
transform:translateY(-6px)
}

</style>
</head>

<body>

<header>
CHAT LEVEL MAX
<div class="online">
Online Users: <span id="onlineCount">0</span>
</div>
</header>

<input id="search" placeholder="Search messages...">

<div id="messages"></div>
<div id="typing"></div>

<div class="input-area">
<input type="file" id="imgInput" hidden>
<button class="btn" id="imgBtn"><i class="fa fa-image"></i></button>
<button class="btn" id="sendBtn"><i class="fa fa-paper-plane"></i></button>
<input id="messageInput" placeholder="Type message...">
</div>

<!-- MENU BAR NOT MODIFIED -->
<div class="menu-bar">
<a href="home.html"><i class="fa-solid fa-house"></i></a>
<a href="stream.html"><i class="fa-solid fa-video"></i></a>
<a href="data.html"><i class="fa-solid fa-sim-card"></i></a>
<a href="chat.html" class="active"><i class="fa-solid fa-comments"></i></a>
<a href="profile.html"><i class="fa-solid fa-user"></i></a>
</div>

<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import{getAuth,onAuthStateChanged}
from"https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

import{
getDatabase,ref,push,onChildAdded,set,onDisconnect,
remove,update,onValue
}from"https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

/* ================= FIREBASE ================= */

const firebaseConfig={
apiKey:"AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain:"qwen-911.firebaseapp.com",
databaseURL:"https://qwen-911-default-rtdb.firebaseio.com",
projectId:"qwen-911"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

const box=document.getElementById("messages");

let replyTo=null;
let lastSender=null;
let typingTimeout;

/* ================= AUTH ================= */

onAuthStateChanged(auth,user=>{
if(!user)location.href="login.html";

const username=user.email.split("@")[0];

/* ===== ONLINE COUNT ===== */

const onlineRef=ref(db,"online/"+username);
set(onlineRef,true);
onDisconnect(onlineRef).remove();

onValue(ref(db,"online"),snap=>{
onlineCount.textContent=
snap.exists()?Object.keys(snap.val()).length:0;
});

/* ===== SEND MESSAGE ===== */

function send(){
const text=messageInput.value.trim();
if(!text)return;

push(ref(db,"messages"),{
text,
user:username,
time:Date.now(),
reply:replyTo,
reactions:{},
seen:false
});

messageInput.value="";
replyTo=null;
removeReplyPreview();
}

sendBtn.onclick=send;

messageInput.addEventListener("keydown",e=>{
if(e.key==="Enter")send();
});

/* ===== TYPING ===== */

messageInput.oninput=()=>{
set(ref(db,"typing/"+username),true);

clearTimeout(typingTimeout);
typingTimeout=setTimeout(()=>{
remove(ref(db,"typing/"+username));
},1200);
};

onValue(ref(db,"typing"),snap=>{
if(!snap.exists())return typing.innerText="";
const users=
Object.keys(snap.val()).filter(u=>u!==username);

typing.innerText=
users.length?users.join(", ")+" typing...":"";
});

/* ===== IMAGE SEND ===== */

imgBtn.onclick=()=>imgInput.click();

imgInput.onchange=e=>{
const file=e.target.files[0];
if(!file)return;

const reader=new FileReader();
reader.onload=()=>{
push(ref(db,"messages"),{
image:reader.result,
user:username,
time:Date.now(),
reply:null,
reactions:{},
seen:false
});
};
reader.readAsDataURL(file);
};

/* ===== REPLY UI ===== */

function showReply(text){
removeReplyPreview();

const bar=document.createElement("div");
bar.id="replyBar";
bar.className="reply-preview";
bar.innerHTML=`Replying: ${text} ❌`;

bar.onclick=()=>{
replyTo=null;
bar.remove();
};

document.querySelector(".input-area").prepend(bar);
}

function removeReplyPreview(){
const old=document.getElementById("replyBar");
if(old)old.remove();
}

/* ===== LOAD MESSAGES ===== */

onChildAdded(ref(db,"messages"),snap=>{

const m=snap.val();
const key=snap.key;

const div=document.createElement("div");
div.className="msg "+(m.user===username?"sent":"received");

/* username small text top */
if(lastSender!==m.user){
const label=document.createElement("div");
label.className="user-label";
label.textContent=m.user;
div.appendChild(label);
lastSender=m.user;
}

const bubble=document.createElement("div");
bubble.className="bubble";

bubble.innerHTML=`
${m.reply?`<div class="reply-preview">${m.reply}</div>`:""}
${m.text||""}
${m.image?'<img src="'+m.image+'" style="width:100%;border-radius:10px;margin-top:6px">':""}
<div class="react">${m.reactions?Object.values(m.reactions).join(" "):""}</div>
<div class="time">
${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
${m.user===username?'<span class="ticks">'+(m.seen?'✓✓':'✓')+'</span>':""}
</div>
`;

/* CLICK REPLY */
bubble.onclick=()=>{
replyTo=m.text||"Image";
showReply(replyTo);
};

/* DOUBLE CLICK REACT ❤️ */
bubble.ondblclick=()=>{
update(ref(db,"messages/"+key+"/reactions/"+username),"❤️");
};

/* RIGHT CLICK MENU (FIXED) */
bubble.oncontextmenu=e=>{
e.preventDefault();

const action=prompt("1.React  2.Edit  3.Delete");

if(action==="1"){
const emoji=prompt("Emoji 👍🔥😂❤️");
if(emoji)
update(ref(db,"messages/"+key+"/reactions/"+username),emoji);
}

if(action==="2" && m.user===username){
const edit=prompt("Edit message",m.text);
if(edit!==null)
update(ref(db,"messages/"+key),{text:edit});
}

if(action==="3" && m.user===username){
remove(ref(db,"messages/"+key));
div.remove();
}
};

div.appendChild(bubble);
box.appendChild(div);

requestAnimationFrame(()=>{
box.scrollTop=box.scrollHeight;
});

if(m.user!==username){
update(ref(db,"messages/"+key),{seen:true});
}

});

/* ===== SEARCH ===== */

search.oninput=()=>{
const val=search.value.toLowerCase();

document.querySelectorAll(".msg").forEach(m=>{
m.style.display=
m.innerText.toLowerCase().includes(val)
?"flex":"none";
});
};

});

</script>
</body>
                         </html>
