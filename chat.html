<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWEN-911 Global Chat — MAX UPGRADED</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* === YOUR ORIGINAL CSS — UNTOUCHED === */

body{
margin:0;
font-family:Inter,system-ui;
background:#06070d;
color:#fff;
display:flex;
flex-direction:column;
height:100vh;
overflow:hidden;
padding-bottom:120px;
}

header{
padding:14px;
text-align:center;
background:rgba(15,15,25,.85);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.06);
font-size:15px;
letter-spacing:.6px;
}

.online{
font-size:11px;
color:#00f5ff;
opacity:.85;
}

#typingIndicator{
font-size:11px;
color:#aaa;
text-align:center;
height:18px;
}

#messages{
flex:1;
overflow-y:auto;
padding:14px;
display:flex;
flex-direction:column;
gap:10px;
scroll-behavior:smooth;
}

.msg{
max-width:85%;
display:flex;
flex-direction:column;
animation:fade .25s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(8px)}
to{opacity:1}
}

.sent{align-self:flex-end;}
.received{align-self:flex-start;}

.bubble{
padding:10px 14px;
border-radius:18px;
font-size:14px;
position:relative;
line-height:1.4;
box-shadow:0 0 12px rgba(0,0,0,.3);
}

.sent .bubble{
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
}

.received .bubble{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.07);
}

.time{
font-size:9px;
opacity:.65;
margin-top:4px;
text-align:right;
}

.ticks{color:#00f5ff;margin-left:4px}

.react{
font-size:12px;
margin-top:4px;
cursor:pointer;
}

.download-btn{
position:absolute;
bottom:6px;
right:6px;
background:rgba(0,0,0,.6);
border:none;
color:#fff;
font-size:11px;
padding:4px 6px;
border-radius:6px;
cursor:pointer;
}

video,img{
width:100%;
border-radius:10px;
margin-top:6px;
}

.voice-bubble{
display:flex;
align-items:center;
gap:8px;
background:rgba(0,0,0,.25);
padding:8px 12px;
border-radius:20px;
}

.input-area{
position:fixed;
bottom:90px;
width:100%;
display:flex;
gap:6px;
padding:10px;
background:rgba(18,18,28,.92);
backdrop-filter:blur(18px);
}

#messageInput{
flex:1;
padding:10px;
border:none;
border-radius:25px;
background:rgba(255,255,255,.05);
color:#fff;
outline:none;
}

.btn{
width:40px;
height:40px;
border:none;
border-radius:50%;
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
cursor:pointer;
}

/* MENU BAR UNTOUCHED */
.menu-bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:450px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(25px);
border-radius:35px;
display:flex;
justify-content:space-around;
padding:14px 5px;
box-shadow:0 0 20px rgba(0,245,255,.3)
}

.menu-bar a{
color:#888;
font-size:22px;
flex:1;
text-align:center;
text-decoration:none
}

.menu-bar a.active{
color:#00f5ff;
transform:translateY(-6px)
}

</style>
</head>

<body>

<header>
CHAT LEVEL MAX
<div class="online">
Online Users: <span id="onlineCount">0</span>
</div>
</header>

<div id="typingIndicator"></div>
<div id="messages"></div>

<div class="input-area">
<input type="file" id="imgInput" hidden accept="image/*">
<input type="file" id="videoInput" hidden accept="video/*">
<button class="btn" id="imgBtn"><i class="fa fa-image"></i></button>
<button class="btn" id="videoBtn"><i class="fa fa-video"></i></button>
<button class="btn" id="voiceBtn"><i class="fa fa-microphone"></i></button>
<button class="btn" id="sendBtn"><i class="fa fa-paper-plane"></i></button>
<input id="messageInput" placeholder="Type message...">
</div>

<div class="menu-bar">
<a href="home.html"><i class="fa-solid fa-house"></i></a>
<a href="stream.html"><i class="fa-solid fa-video"></i></a>
<a href="data.html"><i class="fa-solid fa-sim-card"></i></a>
<a href="chat.html" class="active"><i class="fa-solid fa-comments"></i></a>
<a href="profile.html"><i class="fa-solid fa-user"></i></a>
</div>

<script type="module">
<!-- ONLY SCRIPT SECTION CHANGED — UI & CSS UNTOUCHED -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getDatabase, ref, push, onChildAdded, set, onDisconnect, remove, update, onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";

const firebaseConfig={
apiKey:"AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain:"qwen-911.firebaseapp.com",
databaseURL:"https://qwen-911-default-rtdb.firebaseio.com",
projectId:"qwen-911",
storageBucket:"qwen-911.appspot.com"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const storage=getStorage(app);

let username="";
let mediaRecorder=null;
let audioChunks=[];

onAuthStateChanged(auth,user=>{
if(!user) location.href="login.html";
username=user.email.split("@")[0];

/* ONLINE */
const onlineRef=ref(db,"online/"+username);
set(onlineRef,true);
onDisconnect(onlineRef).remove();

onValue(ref(db,"online"),snap=>{
onlineCount.textContent=snap.exists()?Object.keys(snap.val()).length:0;
});

/* TEXT MESSAGE */
sendBtn.onclick=()=>{
const text=messageInput.value.trim();
if(!text)return;

push(ref(db,"messages"),{
type:"text",
text,
user:username,
time:Date.now(),
seen:false
});

messageInput.value="";
};

/* 🔥 IMAGE COMPRESSION */
async function compressImage(file){
return new Promise(resolve=>{
const img=new Image();
const reader=new FileReader();

reader.onload=e=>img.src=e.target.result;

img.onload=()=>{
const canvas=document.createElement("canvas");
const maxWidth=1280;

let width=img.width;
let height=img.height;

if(width>maxWidth){
height*=maxWidth/width;
width=maxWidth;
}

canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext("2d");
ctx.drawImage(img,0,0,width,height);

canvas.toBlob(blob=>{
resolve(blob);
},"image/jpeg",0.7);
};

reader.readAsDataURL(file);
});
}

/* IMAGE UPLOAD */
imgBtn.onclick=()=>imgInput.click();
imgInput.onchange=async e=>{
const file=e.target.files[0];
if(!file)return;

const compressed=await compressImage(file);

const fileRef=sRef(storage,`chatMedia/images/${Date.now()}.jpg`);
await uploadBytes(fileRef,compressed);
const url=await getDownloadURL(fileRef);

push(ref(db,"messages"),{
type:"image",
url,
user:username,
time:Date.now()
});
};

/* VIDEO UPLOAD */
videoBtn.onclick=()=>videoInput.click();
videoInput.onchange=async e=>{
const file=e.target.files[0];
if(!file)return;

const fileRef=sRef(storage,`chatMedia/videos/${Date.now()}_${file.name}`);
await uploadBytes(fileRef,file);
const url=await getDownloadURL(fileRef);

push(ref(db,"messages"),{
type:"video",
url,
user:username,
time:Date.now()
});
};

/* VOICE RECORD */
voiceBtn.onmousedown=async()=>{
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
mediaRecorder=new MediaRecorder(stream);
audioChunks=[];
mediaRecorder.start();

mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
};

document.onmouseup=stopVoice;
voiceBtn.ondblclick=stopVoice;

async function stopVoice(){
if(mediaRecorder && mediaRecorder.state==="recording"){
mediaRecorder.stop();
mediaRecorder.onstop=async()=>{
const blob=new Blob(audioChunks,{type:"audio/webm"});
const fileRef=sRef(storage,`chatMedia/voice/${Date.now()}.webm`);
await uploadBytes(fileRef,blob);
const url=await getDownloadURL(fileRef);

push(ref(db,"messages"),{
type:"voice",
url,
user:username,
time:Date.now()
});
};
}
}

/* LOAD MESSAGES */
onChildAdded(ref(db,"messages"),snap=>{
const m=snap.val();
const div=document.createElement("div");
div.className="msg "+(m.user===username?"sent":"received");

let content="";

if(m.type==="text") content=m.text;

if(m.type==="image"){
content=`<img src="${m.url}">
<button class="download-btn" onclick="window.open('${m.url}')">
<i class="fa fa-download"></i></button>`;
}

if(m.type==="video"){
content=`<video controls src="${m.url}"></video>
<button class="download-btn" onclick="window.open('${m.url}')">
<i class="fa fa-download"></i></button>`;
}

if(m.type==="voice"){
content=`<div class="voice-bubble">
<audio controls src="${m.url}"></audio>
</div>`;
}

div.innerHTML=`<div class="bubble">
${content}
<div class="time">
${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
</div>
</div>`;

messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
});

});
</script>
  
<script type="module" src="analytics.js"></script>

</body>
</html>
