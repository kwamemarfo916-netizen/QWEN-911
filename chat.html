<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWEN-911 Global Chat</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Inter,system-ui;
background:#06070d;
color:#fff;
display:flex;
flex-direction:column;
height:100vh;
overflow:hidden;
padding-bottom:120px;
}

/* HEADER */

header{
padding:14px;
text-align:center;
background:rgba(15,15,25,.85);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.06);
}

.online{
font-size:11px;
color:#00f5ff;
}

/* TOP CHAT SWITCH BAR */

.chat-switch{
display:flex;
gap:8px;
padding:10px;
justify-content:center;
background:#0c0d15;
border-bottom:1px solid rgba(255,255,255,.05);
}

.chat-switch button{
background:rgba(255,255,255,.05);
border:none;
color:#fff;
padding:8px 14px;
border-radius:18px;
font-size:12px;
cursor:pointer;
}

.chat-switch button.active{
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
}

/* MESSAGE AREA */

#messages{
flex:1;
overflow-y:auto;
padding:14px;
display:flex;
flex-direction:column;
gap:10px;
}

/* MESSAGE */

.msg{
max-width:85%;
display:flex;
gap:8px;
}

.sent{
align-self:flex-end;
flex-direction:row-reverse;
}

.msg img.avatar{
width:32px;
height:32px;
border-radius:50%;
object-fit:cover;
border:1px solid #00f5ff;
}

.bubble{
padding:10px 14px;
border-radius:16px;
background:rgba(255,255,255,.05);
font-size:14px;
position:relative;
}

.sent .bubble{
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
}

.username{
font-size:11px;
color:#00f5ff;
margin-bottom:3px;
}

.time{
font-size:9px;
opacity:.7;
text-align:right;
}

.ticks{
margin-left:5px;
color:#00f5ff;
font-size:10px;
}

/* INPUT */

.input-area{
position:fixed;
bottom:90px;
width:100%;
display:flex;
gap:6px;
padding:10px;
background:rgba(18,18,28,.92);
}

#messageInput{
flex:1;
padding:10px;
border:none;
border-radius:25px;
background:rgba(255,255,255,.05);
color:#fff;
outline:none;
}

.btn{
width:40px;
height:40px;
border:none;
border-radius:50%;
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
}

/* MENU BAR */

.menu-bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:450px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(25px);
border-radius:35px;
display:flex;
justify-content:space-around;
padding:14px 5px;
box-shadow:0 0 20px rgba(0,245,255,.3)
}

.menu-bar a{
color:#888;
font-size:22px;
flex:1;
text-align:center;
text-decoration:none
}

.menu-bar a.active{
color:#00f5ff;
transform:translateY(-6px)
}

</style>
</head>

<body>

<header>
CHAT LEVEL MAX
<div class="online">
Online Users: <span id="onlineCount">0</span>
</div>
</header>

<div class="chat-switch">
<button id="globalBtn" class="active">Group Chat</button>
<button id="privateBtn">Private Chat</button>
<button id="campaignBtn">Campaign</button>
</div>

<div id="messages"></div>

<div class="input-area">

<input type="file" id="imgInput" hidden accept="image/*">
<input type="file" id="videoInput" hidden accept="video/*">

<button class="btn" id="imgBtn"><i class="fa fa-image"></i></button>
<button class="btn" id="videoBtn"><i class="fa fa-video"></i></button>
<button class="btn" id="sendBtn"><i class="fa fa-paper-plane"></i></button>

<input id="messageInput" placeholder="Type message...">

</div>

<div class="menu-bar">
<a href="home.html"><i class="fa-solid fa-house"></i></a>
<a href="stream.html"><i class="fa-solid fa-video"></i></a>
<a href="data.html"><i class="fa-solid fa-sim-card"></i></a>
<a href="chat.html" class="active"><i class="fa-solid fa-comments"></i></a>
<a href="profile.html"><i class="fa-solid fa-user"></i></a>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getDatabase, ref, push, onChildAdded, set, get, update, remove, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";

/* FIREBASE */

const firebaseConfig={
apiKey:"AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain:"qwen-911.firebaseapp.com",
databaseURL:"https://qwen-911-default-rtdb.firebaseio.com",
projectId:"qwen-911",
storageBucket:"qwen-911.appspot.com"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const storage=getStorage(app);

/* VARIABLES */

let username="";
let chatMode="global";
let replyMessage=null;

/* AUTH */

onAuthStateChanged(auth,async user=>{

if(!user) location.href="login.html";

username=user.email.split("@")[0];

/* ONLINE USERS */

const onlineRef=ref(db,"online/"+username);

set(onlineRef,true);
onDisconnect(onlineRef).remove();

onValue(ref(db,"online"),snap=>{
onlineCount.textContent=snap.exists()?Object.keys(snap.val()).length:0;
});

/* LOAD MESSAGES */

loadMessages();

});

/* SEND MESSAGE */

sendBtn.onclick=()=>{

const text=messageInput.value.trim();
if(!text)return;

push(ref(db,"messages/"+chatMode),{

text,
user:username,
time:Date.now(),
seen:false,
reply:replyMessage

});

replyMessage=null;
messageInput.value="";

};

/* LOAD MESSAGES */

function loadMessages(){

messages.innerHTML="";

onChildAdded(ref(db,"messages/"+chatMode),async snap=>{

const m=snap.val();
const id=snap.key;

let photo="https://i.imgur.com/2DhmtJ4.png";
let name=m.user;

const userSnap=await get(ref(db,"users/"+m.user));

if(userSnap.exists()){
const u=userSnap.val();
photo=u.photo || photo;
name=u.username || name;
}

const div=document.createElement("div");
div.className="msg "+(m.user===username?"sent":"");

div.innerHTML=`

<img class="avatar" src="${photo}">

<div>

<div class="username">${name}</div>

<div class="bubble">

${m.reply?`<div style="font-size:11px;color:#aaa">↪ ${m.reply}</div>`:""}

${m.text}

<div class="time">

${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}

${m.user===username?`<span class="ticks">${m.seen?"✓✓":"✓"}</span>`:""}

</div>

</div>

<div style="font-size:11px;margin-top:4px">

<span onclick="reply('${m.text}')">Reply</span>

${m.user===username?`
 | <span onclick="editMsg('${id}','${m.text}')">Edit</span>
 | <span onclick="deleteMsg('${id}')">Delete</span>
`:""}

</div>

</div>
`;

messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;

/* SEEN */

if(m.user!==username && !m.seen){

update(ref(db,"messages/"+chatMode+"/"+id),{
seen:true
});

}

});

}

/* REPLY */

window.reply=(text)=>{

replyMessage=text;
messageInput.placeholder="Replying: "+text;

}

/* EDIT */

window.editMsg=(id,text)=>{

const newText=prompt("Edit message:",text);

if(newText){

update(ref(db,"messages/"+chatMode+"/"+id),{
text:newText
});

}

}

/* DELETE */

window.deleteMsg=(id)=>{

if(confirm("Delete message?")){

remove(ref(db,"messages/"+chatMode+"/"+id));

}

}

/* MEDIA */

imgBtn.onclick=()=>imgInput.click();

imgInput.onchange=async e=>{

const file=e.target.files[0];
if(!file)return;

const fileRef=sRef(storage,"chatImages/"+Date.now());

await uploadBytes(fileRef,file);

const url=await getDownloadURL(fileRef);

push(ref(db,"messages/"+chatMode),{

type:"image",
url,
user:username,
time:Date.now()

});

};

videoBtn.onclick=()=>videoInput.click();

videoInput.onchange=async e=>{

const file=e.target.files[0];
if(!file)return;

const fileRef=sRef(storage,"chatVideos/"+Date.now());

await uploadBytes(fileRef,file);

const url=await getDownloadURL(fileRef);

push(ref(db,"messages/"+chatMode),{

type:"video",
url,
user:username,
time:Date.now()

});

};

</script>

<script type="module" src="analytics.js"></script>

</body>
 </html>
