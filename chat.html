<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWEN-911 Global Chat</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* YOUR CSS UNCHANGED */

body{
margin:0;
font-family:Inter,system-ui;
background:#06070d;
color:#fff;
display:flex;
flex-direction:column;
height:100vh;
overflow:hidden;
padding-bottom:120px;
}

header{
padding:14px;
text-align:center;
background:rgba(15,15,25,.85);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.06);
}

.online{
font-size:11px;
color:#00f5ff;
}

.chat-switch{
display:flex;
gap:8px;
padding:10px;
justify-content:center;
background:#0c0d15;
border-bottom:1px solid rgba(255,255,255,.05);
}

.chat-switch button{
background:rgba(255,255,255,.05);
border:none;
color:#fff;
padding:8px 14px;
border-radius:18px;
font-size:12px;
cursor:pointer;
}

.chat-switch button.active{
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
}

#messages{
flex:1;
overflow-y:auto;
padding:14px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
max-width:85%;
display:flex;
gap:8px;
}

.sent{
align-self:flex-end;
flex-direction:row-reverse;
}

.msg img.avatar{
width:32px;
height:32px;
border-radius:50%;
object-fit:cover;
border:1px solid #00f5ff;
}

.bubble{
padding:10px 14px;
border-radius:16px;
background:rgba(255,255,255,.05);
font-size:14px;
position:relative;
}

.sent .bubble{
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
}

.username{
font-size:11px;
color:#00f5ff;
margin-bottom:3px;
}

.time{
font-size:9px;
opacity:.7;
text-align:right;
}

.actions{
font-size:10px;
margin-top:4px;
display:flex;
gap:8px;
}

.actions span{
cursor:pointer;
opacity:.7;
}

.actions span:hover{
opacity:1;
}

.input-area{
position:fixed;
bottom:90px;
width:100%;
display:flex;
gap:6px;
padding:10px;
background:rgba(18,18,28,.92);
}

#messageInput{
flex:1;
padding:10px;
border:none;
border-radius:25px;
background:rgba(255,255,255,.05);
color:#fff;
outline:none;
}

.btn{
width:40px;
height:40px;
border:none;
border-radius:50%;
background:linear-gradient(135deg,#00f5ff,#a855f7);
color:#000;
}

.menu-bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:450px;
background:rgba(20,20,30,.9);
backdrop-filter:blur(25px);
border-radius:35px;
display:flex;
justify-content:space-around;
padding:14px 5px;
box-shadow:0 0 20px rgba(0,245,255,.3)
}

.menu-bar a{
color:#888;
font-size:22px;
flex:1;
text-align:center;
text-decoration:none
}

.menu-bar a.active{
color:#00f5ff;
transform:translateY(-6px)
}

</style>
</head>

<body>

<header>
CHAT LEVEL MAX
<div class="online">
Online Users: <span id="onlineCount">0</span>
</div>
</header>

<div class="chat-switch">
<a href="chat.html"><button class="active">Group Chat</button></a>
<a href="privatechat.html"><button>Private Chat</button></a>
<a href="campaign.html"><button>Campaign</button></a>
</div>

<div id="messages"></div>

<div class="input-area">

<input type="file" id="imgInput" hidden accept="image/*">
<input type="file" id="videoInput" hidden accept="video/*">

<button class="btn" id="imgBtn"><i class="fa fa-image"></i></button>
<button class="btn" id="videoBtn"><i class="fa fa-video"></i></button>
<button class="btn" id="sendBtn"><i class="fa fa-paper-plane"></i></button>

<input id="messageInput" placeholder="Type message...">

</div>

<div class="menu-bar">
<a href="home.html"><i class="fa-solid fa-house"></i></a>
<a href="stream.html"><i class="fa-solid fa-video"></i></a>
<a href="data.html"><i class="fa-solid fa-sim-card"></i></a>
<a href="chat.html" class="active"><i class="fa-solid fa-comments"></i></a>
<a href="profile.html"><i class="fa-solid fa-user"></i></a>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getDatabase, ref, push, onChildAdded, set, onValue, onDisconnect, update, remove } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* SUPABASE */

const supabase=createClient(
"https://qagawtgfpfupobwuotvw.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhZ2F3dGdmcGZ1cG9id3VvdHZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMDIzNzYsImV4cCI6MjA4Nzg3ODM3Nn0.-ocXPElc-S6aPlqpJBr0-Fvhv8rvaxEDnWKbw5C4dD4"
);

/* FIREBASE */

const firebaseConfig={
apiKey:"AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain:"qwen-911.firebaseapp.com",
databaseURL:"https://qwen-911-default-rtdb.firebaseio.com",
projectId:"qwen-911"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

let username="";
let chatMode="global";

const messages=document.getElementById("messages");

onAuthStateChanged(auth,user=>{

if(!user) location.href="login.html";

username=user.email.split("@")[0];

const onlineRef=ref(db,"online/"+username);

set(onlineRef,true);
onDisconnect(onlineRef).remove();

onValue(ref(db,"online"),snap=>{
onlineCount.textContent=snap.exists()?Object.keys(snap.val()).length:0;
});

loadMessages();

});

/* SEND MESSAGE */

sendBtn.onclick=()=>{

const text=messageInput.value.trim();
if(!text)return;

push(ref(db,"messages/"+chatMode),{
text,
user:username,
time:Date.now()
});

messageInput.value="";

};

/* LOAD MESSAGES */

function loadMessages(){

onChildAdded(ref(db,"messages/"+chatMode),snap=>{

const msg=snap.val();
const key=snap.key;

const div=document.createElement("div");
div.className="msg"+(msg.user===username?" sent":"");

let content="";

if(msg.type==="image"){
content=`<img src="${msg.url}" style="max-width:200px;border-radius:10px;">`;
}
else if(msg.type==="video"){
content=`<video src="${msg.url}" controls style="max-width:200px;border-radius:10px;"></video>`;
}
else{
content=msg.text;
}

let actions="";

if(msg.user===username){

actions=`
<div class="actions">
<span onclick="editMessage('${key}','${msg.text || ""}')">edit</span>
<span onclick="deleteMessage('${key}')">delete</span>
</div>
`;

}

div.innerHTML=`

<img class="avatar" src="https://api.dicebear.com/7.x/initials/svg?seed=${msg.user}">

<div class="bubble">

<div class="username">${msg.user}</div>

<div>${content}</div>

<div class="time">${new Date(msg.time).toLocaleTimeString()}</div>

${actions}

</div>

`;

messages.appendChild(div);

messages.scrollTop=messages.scrollHeight;

});

}

/* EDIT MESSAGE */

window.editMessage=function(key,text){

const newText=prompt("Edit message:",text);

if(newText===null)return;

update(ref(db,"messages/"+chatMode+"/"+key),{
text:newText,
edited:true
});

}

/* DELETE MESSAGE */

window.deleteMessage=function(key){

if(!confirm("Delete message?"))return;

remove(ref(db,"messages/"+chatMode+"/"+key));

}

/* IMAGE UPLOAD */

imgBtn.onclick=()=>imgInput.click();

imgInput.onchange=async e=>{

const file=e.target.files[0];
if(!file)return;

const fileName="images/"+Date.now()+"_"+file.name;

const { error } = await supabase.storage
.from("QWEN-911(storage)")
.upload(fileName,file);

if(error){
console.log(error);
return;
}

const { data } = supabase.storage
.from("QWEN-911(storage)")
.getPublicUrl(fileName);

push(ref(db,"messages/"+chatMode),{
type:"image",
url:data.publicUrl,
user:username,
time:Date.now()
});

};

/* VIDEO UPLOAD */

videoBtn.onclick=()=>videoInput.click();

videoInput.onchange=async e=>{

const file=e.target.files[0];
if(!file)return;

const fileName="videos/"+Date.now()+"_"+file.name;

const { error } = await supabase.storage
.from("QWEN-911(storage)")
.upload(fileName,file);

if(error){
console.log(error);
return;
}

const { data } = supabase.storage
.from("QWEN-911(storage)")
.getPublicUrl(fileName);

push(ref(db,"messages/"+chatMode),{
type:"video",
url:data.publicUrl,
user:username,
time:Date.now()
});

};

</script>

<script type="module" src="analytics.js"></script>

</body>
  </html>
