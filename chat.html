<!DOCTYPE html>
<html>
<head>
    <title>QWEN-911 Live Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, blue, purple, aquamarine);
            color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #chat {
            width: 400px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        #messages {
            list-style: none;
            padding: 0;
            height: 300px;
            overflow-y: auto;
        }

        #messages li {
            padding: 8px;
            margin: 5px 0;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
        }

        form {
            display: flex;
            gap: 5px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
        }

        button {
            padding: 10px;
            background: aquamarine;
            border: none;
            color: black;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="chat">
        <h2>💬 QWEN-911 Live Chat</h2>
        <ul id="messages"></ul>
        <form id="form">
            <input id="input" autocomplete="off" placeholder="Type a message..." />
            <button>Send</button>
        </form>
    </div>
    <!-- Bottom Floating Navigation -->
<style>
.bottom-nav {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 500px;
    background: rgba(20,20,30,0.95);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 12px 10px;
    border-radius: 25px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    z-index: 1000;
}

.bottom-nav a {
    text-decoration: none;
    color: white;
    text-align: center;
    font-size: 13px;
}

.bottom-nav a:hover {
    color: aquamarine;
}

.nav-icon {
    font-size: 20px;
    display: block;
    margin-bottom: 4px;
}
</style>

<div class="bottom-nav">
    <a href="home.html">
        <span class="nav-icon">🏠</span>
        Home
    </a>

    <a href="chat-list.html">
        <span class="nav-icon">💬</span>
        Chats
    </a>

    <a href="stream.html">
        <span class="nav-icon">📺</span>
        Stream
    </a>

    <a href="data.html">
        <span class="nav-icon">📡</span>
        Data
    </a>

    <a href="profile.html">
        <span class="nav-icon">👤</span>
        Profile
    </a>
</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } 
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
          authDomain: "qwen-911.firebaseapp.com",
          databaseURL: "https://qwen-911-default-rtdb.firebaseio.com",
          projectId: "qwen-911",
          storageBucket: "qwen-911.firebasestorage.app",
          messagingSenderId: "518019892837",
          appId: "1:518019892837:web:9972dd63d8dca7936ea88c",
          measurementId: "G-0LZW0FZ3Q0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const form = document.getElementById("form");
        const input = document.getElementById("input");
        const messages = document.getElementById("messages");

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            if (input.value) {
                push(ref(db, "messages"), input.value);
                input.value = "";
            }
        });

        onChildAdded(ref(db, "messages"), (snapshot) => {
            const item = document.createElement("li");
            item.textContent = snapshot.val();
            messages.appendChild(item);
        });
    </script>
</body>
</html>
