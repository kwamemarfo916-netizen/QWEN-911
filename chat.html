<!DOCTYPE html>
<html>
<head>
  <title>Live Chat - QWEN-911</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, blue, purple, aquamarine);
      color: white;
    }

    header {
      padding: 15px;
      background: rgba(0,0,0,0.4);
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      display: flex;
      height: 90vh;
    }

    .stream, .media {
      flex: 2;
      padding: 15px;
    }

    .chat {
      flex: 1;
      background: rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    .msg {
      margin-bottom: 8px;
      padding: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 6px;
    }

    .input-box {
      display: flex;
      padding: 10px;
      background: rgba(0,0,0,0.6);
    }

    .input-box input {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 5px;
    }

    .input-box button {
      margin-left: 8px;
      padding: 8px 12px;
      border: none;
      background: purple;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    video {
      width: 100%;
      border-radius: 10px;
    }

    .media img {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<header>
  💬 Live Stream & Chat
</header>

<div class="container">
  
  <!-- Stream Section -->
  <div class="stream">
    <h2>Live Stream</h2>
    <video controls>
      <source src="sample.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Chat Section -->
  <div class="chat">
    <div id="messages"></div>

    <div class="input-box">
      <input id="messageInput" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- Media Section -->
  <div class="media">
    <h2>Media</h2>
    <img src="https://via.placeholder.com/400x200" alt="Media">
    <img src="https://via.placeholder.com/400x200" alt="Media">
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

signInAnonymously(auth);

window.sendMessage = async function () {
  const input = document.getElementById("messageInput");
  const text = input.value;

  if (!text) return;

  await addDoc(collection(db, "messages"), {
    text: text,
    time: Date.now()
  });

  input.value = "";
};

const q = query(collection(db, "messages"), orderBy("time"));

onSnapshot(q, (snapshot) => {
  const chat = document.getElementById("messages");
  chat.innerHTML = "";

  snapshot.forEach((doc) => {
    const msg = doc.data();
    chat.innerHTML += `<div class="msg">${msg.text}</div>`;
  });
});
</script>

</body>
  </html>
