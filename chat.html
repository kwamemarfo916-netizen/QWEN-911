<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWEN-911 Global Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body{margin:0;font-family:Inter,sans-serif;background:#0a0a12;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden;padding-bottom:120px}
header{padding:12px;text-align:center;background:rgba(20,20,30,.9);backdrop-filter:blur(15px);border-bottom:1px solid rgba(255,255,255,.05)}
#search{width:90%;margin:8px auto;padding:6px 12px;border:none;border-radius:20px;background:rgba(255,255,255,.05);color:#fff;outline:none}
#messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.msg{display:flex;gap:6px;max-width:85%;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.bubble{padding:8px 12px;border-radius:16px;font-size:14px;position:relative}
.sent{align-self:flex-end}
.sent .bubble{background:linear-gradient(135deg,#00f5ff,#a855f7);color:#000}
.received{align-self:flex-start}
.received .bubble{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.avatar{width:28px;height:28px;border-radius:50%;background:#a855f7;display:flex;align-items:center;justify-content:center;font-size:12px}
.time{font-size:9px;opacity:.7;margin-top:3px;text-align:right}
.react{font-size:11px;margin-top:3px}
.input-area{position:fixed;bottom:90px;width:100%;display:flex;gap:6px;padding:8px;background:rgba(20,20,30,.95);backdrop-filter:blur(15px)}
#messageInput{flex:1;padding:8px;border:none;border-radius:20px;background:rgba(255,255,255,.05);color:#fff;outline:none}
.btn{width:38px;height:38px;border:none;border-radius:50%;background:linear-gradient(135deg,#00f5ff,#a855f7);color:#000;cursor:pointer}
.menu-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:92%;max-width:450px;background:rgba(20,20,30,.9);backdrop-filter:blur(25px);border-radius:35px;display:flex;justify-content:space-around;padding:14px 5px;box-shadow:0 0 20px rgba(0,245,255,.3)}
.menu-bar a{color:#888;font-size:22px;flex:1;text-align:center;text-decoration:none;transition:.3s}
.menu-bar a.active{color:#00f5ff;transform:translateY(-6px)}
.unread{position:absolute;top:8px;right:20px;background:red;color:#fff;border-radius:50%;font-size:10px;padding:2px 6px}
</style>
</head>
<body>

<header>
Global Chat
<div id="unread" class="unread" style="display:none">0</div>
</header>

<input id="search" placeholder="Search messages...">

<div id="messages"></div>

<div class="input-area">
<button class="btn" id="sendBtn"><i class="fa fa-paper-plane"></i></button>
<input type="text" id="messageInput" placeholder="Type message...">
</div>

<div class="menu-bar">
<a href="home.html"><i class="fa-solid fa-house"></i></a>
<a href="stream.html"><i class="fa-solid fa-video"></i></a>
<a href="data.html"><i class="fa-solid fa-sim-card"></i></a>
<a href="chat.html" class="active"><i class="fa-solid fa-comments"></i></a>
<a href="profile.html"><i class="fa-solid fa-user"></i></a>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import{getDatabase,ref,push,onChildAdded,update,remove}from"https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyDMPhlgEkaedtGWEiYF84JR_kDRJQZF68I",
authDomain:"qwen-911.firebaseapp.com",
databaseURL:"https://qwen-911-default-rtdb.firebaseio.com",
projectId:"qwen-911"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
let unread=0;

onAuthStateChanged(auth,user=>{
if(!user)return location.href="login.html";
const username=user.email.split("@")[0];
const box=document.getElementById("messages");

sendBtn.onclick=()=>{
let text=messageInput.value.trim();
if(!text)return;
push(ref(db,"messages"),{text,user:username,time:Date.now(),reactions:{}});
messageInput.value="";
};

onChildAdded(ref(db,"messages"),snap=>{
const m=snap.val();const key=snap.key;
const div=document.createElement("div");
div.className="msg "+(m.user===username?"sent":"received");

const avatar=document.createElement("div");
avatar.className="avatar";
avatar.innerText=m.user.charAt(0).toUpperCase();

const bubble=document.createElement("div");
bubble.className="bubble";
bubble.innerHTML=`${m.text||""}
<div class="time">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
<div class="react">${m.reactions?Object.values(m.reactions).join(" "):""}</div>`;

bubble.oncontextmenu=e=>{
e.preventDefault();
let action=prompt("1.React 2.Edit 3.Delete");
if(action==1){
let emoji=prompt("Enter emoji 👍🔥😂❤️");
if(emoji)update(ref(db,"messages/"+key+"/reactions/"+username),emoji);
}
if(action==2 && m.user===username){
let edit=prompt("Edit message",m.text);
if(edit)update(ref(db,"messages/"+key),{text:edit});
}
if(action==3 && m.user===username){
remove(ref(db,"messages/"+key));
}
};

if(m.user!==username){div.appendChild(avatar);unread++;unreadBox()}
div.appendChild(bubble);
box.appendChild(div);
box.scrollTop=box.scrollHeight;
});

search.oninput=()=>{
let val=search.value.toLowerCase();
document.querySelectorAll(".bubble").forEach(b=>{
b.style.display=b.innerText.toLowerCase().includes(val)?"block":"none";
});
};

function unreadBox(){
document.getElementById("unread").style.display="block";
document.getElementById("unread").innerText=unread;
}

});
</script>

</body>
</html>
